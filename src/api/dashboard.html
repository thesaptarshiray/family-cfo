        <td></td><td colspan="2" class="empty">↳ ${escapeHtml(pt.owner_name)} · ${escapeHtml(pt.broker)} · ${pt.exchange}</td>
        <td class="empty">${pt.quantity}</td><td class="empty">${pt.avg_buy_price ?? "—"}</td><td></td>
        <td class="empty">₹${money(pt.invested_amount)}</td><td class="empty">₹${money(pt.current_value)}</td>
        <td colspan="3"></td>
        <td><button type="button" class="secondary" data-stock-edit="${pt.asset_id}" style="padding:5px 10px">Edit</button></td>
      </tr>`).join("");
    return `<tr class="${multi ? "group-row" : ""}" data-group="${i}" ${multi ? 'style="cursor:pointer"' : ""}>
        <td>${multi ? "▸" : ""}</td>
        <td><strong>${escapeHtml(g.symbol)}</strong>${g.company_name ? `<div class="empty">${escapeHtml(g.company_name)}</div>` : ""}
          ${multi ? `<div class="empty">${g.parts.length} holdings — click to see</div>`
                  : `<div class="empty">${escapeHtml(g.parts[0].owner_name)} · ${escapeHtml(g.parts[0].broker)}</div>`}</td>
        <td>${escapeHtml(g.sector)}<div class="empty">${CAP_LABEL[g.cap_category]}</div></td>
        <td>${g.quantity}</td><td>${g.avg_buy_price ?? "—"}</td>
        <td>${g.current_price ?? "—"}${lr ? priceNote(lr.stock) : ""}</td>
        <td>₹${money(g.invested_amount)}</td><td>₹${money(g.current_value)}</td>
        <td>${money(g.weight_pct)}%</td>
        ${gainCell(g.gain_loss, g.gain_loss_pct)}
        <td class="${Number(g.realised_gain) >= 0 ? "gain" : "loss"}">${Number(g.realised_gain) ? signedInr(g.realised_gain) : "—"}</td>
        <td>${multi ? "" : `<button type="button" class="secondary" data-stock-edit="${g.parts[0].asset_id}" style="padding:5px 10px">Edit</button>`}</td>
      </tr>${multi ? partsRows : ""}`;
  }).join("") || `<tr><td colspan="12" class="empty">No stocks for ${scopeName(selected)} yet</td></tr>`;

  const holdingOptions = p.rows
    .map((r) => `<option value="${r.stock.asset_id}">${escapeHtml(r.owner_name)} — ${escapeHtml(r.stock.symbol)} (${escapeHtml(r.stock.broker)})</option>`)
    .join("");
  const symbolOptions = p.groups
    .map((g) => `<option value="${g.symbol}">${g.symbol}${g.sector === "Unclassified" ? " (unclassified)" : ""}</option>`).join("");

  const syncText = sync.last_success_date
    ? `Prices synced from NSE/BSE on ${sync.last_success_date} (closing prices of ${sync.last_price_date ?? "—"})`
    : "Prices not yet synced from NSE/BSE";
  const syncError = sync.last_error ? `<span class="loss">Last sync failed: ${escapeHtml(sync.last_error)}</span>` : "";

  const moverList = (list) => list.length
    ? list.map((g) => `<div class="bar-row"><span class="bar-label">${escapeHtml(g.symbol)}</span>
        <span class="bar-value ${Number(g.gain_loss) >= 0 ? "gain" : "loss"}">${Number(g.gain_loss_pct) > 0 ? "+" : ""}${money(g.gain_loss_pct)}%
        <span class="empty">${signedShort(g.gain_loss)}</span></span></div>`).join("")
    : `<p class="empty">None</p>`;

  const riskCards = a.risk_checks.map((rc) => {
    const verdict = rc.fits == null ? `<span class="empty">Pick a risk tolerance to compare</span>`
      : rc.fits ? `<span class="gain">✓ Fits a ${TOLERANCE_LABEL[rc.risk_tolerance].toLowerCase()} investor</span>`
      : `<span class="loss">⚠ Riskier than ${TOLERANCE_LABEL[rc.risk_tolerance].toLowerCase()}</span>`;
    return `<div class="risk-card">
      <div><strong>${escapeHtml(rc.name)}</strong></div>
      <label class="empty">Risk tolerance
        <select data-risk-member="${rc.member_id}">
          <option value="">— pick —</option>
          ${Object.entries(TOLERANCE_LABEL).map(([k, v]) =>
            `<option value="${k}" ${rc.risk_tolerance === k ? "selected" : ""}>${v}</option>`).join("")}
        </select></label>
      <div style="display:flex;flex-direction:column;align-items:center">${gauge(["MODERATE", "HIGH", "VERY_HIGH"].indexOf(rc.portfolio_risk),
        ["Moderate", "High", "Very high"], ["#0f9f6e", "#f59e0b", "#e0445e"], "portfolio risk")}</div>
      <div class="empty">Stocks are ${money(rc.stock_share_of_wealth_pct)}% of their wealth</div>
      <div>${verdict}</div>
      ${rc.reasons.length ? `<ul class="empty" style="margin:4px 0 0 16px; padding:0">${rc.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>` : ""}
    </div>`;
  }).join("");

  const snapshot = p.groups.length ? `
    <div class="card">
      <h3 class="section-title">Portfolio snapshot — ${scopeName(selected)}</h3>
      <div class="snapshot">
        <div class="snap-box"><div class="pie-title">Sector split</div>${donut(a.sector_split.map((sl, i) => ({
          label: sl.name, pct: sl.pct, color: paletteAt(i), valueText: inrShort(sl.value) })), { size: 130, centerTop: String(a.sector_split.length), centerBottom: "sectors" })}
          ${a.sector_warnings.map((w) => `<p class="loss" style="margin:6px 0 0">⚠ ${escapeHtml(w)}</p>`).join("")}</div>
        <div class="snap-box"><div class="pie-title">Market cap</div>${stackBar(a.cap_split.map((sl) => ({
          label: CAP_LABEL[sl.name] || sl.name, pct: sl.pct, valueText: inrShort(sl.value),
          color: { LARGE: "#5b5bf0", MID: "#f59e0b", SMALL: "#ec4899", UNKNOWN: "#94a3b8" }[sl.name] })))}
          <p class="empty">SEBI categories via NSE's index lists${a.classification_date ? ", updated " + a.classification_date : " (not loaded yet — sync prices once)"}.</p></div>
        <div class="snap-box"><div class="pie-title">Concentration</div>
          <div class="bar-row"><span class="bar-label">Stocks held</span><strong>${a.stock_count}</strong></div>
          <div class="bar-row"><span class="bar-label">Largest</span><strong>${escapeHtml(a.largest_symbol ?? "—")} ${money(a.largest_pct)}%</strong></div>
          <div class="bar-row"><span class="bar-label">Top 5</span><strong>${money(a.top5_pct)}%</strong></div>
          <div class="bar-row"><span class="bar-label">Behaves like</span><strong>${a.effective_stocks} equal stocks</strong></div>
          <div class="bar-row"><span class="bar-label">Diversification</span>
            <strong class="${a.diversification === "LOW" ? "loss" : a.diversification === "GOOD" ? "gain" : ""}">${
              { LOW: "Low", MEDIUM: "Medium", GOOD: "Good" }[a.diversification]}</strong></div></div>
        <div class="snap-box"><div class="pie-title">Top gainers</div>${moverList(a.winners)}
          <div class="pie-title" style="margin-top:10px">Top losers</div>${moverList(a.losers)}</div>
      </div>
      <div class="pie-title" style="margin-top:14px">Risk check</div>
      <div class="snapshot">${riskCards}</div>
      <p class="empty">Portfolio risk is a rule of thumb from market-cap mix, concentration and number of stocks; volatility-based measures come once a few months of daily prices are saved.</p>
    </div>` : "";

  body.innerHTML = `
    <div class="sync-line">
      <span>${syncText}</span>${syncError}
      <button type="button" class="secondary" id="stock-sync-btn">Sync prices now</button>
      <span id="stock-sync-result"></span>
    </div>
    <div class="totals">
      ${stat("Invested", p.total_invested)}
      ${stat("Current value", p.total_current_value)}
      ${stat("Unrealised gain / loss", p.total_gain_loss, true)}
      ${stat("Realised gain / loss", p.total_realised_gain, true)}
      <div class="stat"><div class="label">XIRR</div><div class="value small">${pct(p.xirr)}</div>
        ${p.xirr_excluded_count ? `<div class="sub">${p.xirr_excluded_count} stock${p.xirr_excluded_count === 1 ? "" : "s"} imported from a CAS left out: no buy history yet</div>` : ""}</div>
    </div>
    <div class="subnav" id="stock-views">
      <button type="button" data-view="HOLDINGS" class="${stockView === "HOLDINGS" ? "active" : ""}">Holdings (${p.groups.length})</button>
      <button type="button" data-view="ANALYSIS" class="${stockView === "ANALYSIS" ? "active" : ""}">Analysis: sectors, market cap &amp; risk</button>
    </div>
    <div id="stock-analysis">${snapshot}</div>
    <div class="card" id="stock-holdings">
      <h3 class="section-title">Holdings — ${scopeName(selected)} (${p.groups.length} stock${p.groups.length === 1 ? "" : "s"})</h3>
      <table>
        <thead><tr>
          <th></th><th>Stock</th><th>Sector</th><th>Qty</th><th>Avg buy</th><th>Current price</th>
          <th>Invested</th><th>Current value</th><th>Weight</th><th>Unrealised</th><th>Realised</th><th></th>
        </tr></thead>
        <tbody>${groupRows}</tbody>
      </table>
      <details id="stock-edit-details" style="display:none">
        <summary>Edit holding</summary>
        <form class="inline" id="stock-hold-form">
          ${ownerSelect(members, null)}
          <label>Symbol<input name="symbol" required></label>
          <label>Company name<input name="name"></label>

          <label>Type<select name="txn_type"><option value="BUY">Buy</option><option value="SELL">Sell</option></select></label>
          <label>Quantity<input name="quantity" type="number" step="0.0001" required></label>
          <label>Price / share<input name="price" type="number" step="0.0001" required></label>
          <label>Charges<input name="charges" type="number" step="0.01"></label>
          <button type="submit">Save entry</button>
          <button type="button" class="secondary" id="stock-txn-edit-cancel">Cancel</button>
        </form>
        <div class="error" id="stock-txn-edit-error"></div>
      </details>
      <p class="empty">One row per stock: quantity and average buy price combine every purchase (average-cost method, charges included). Buying a stock you already hold with the same broker adds to that holding.</p>
      ${members.length ? `
      <details>
        <summary>Add a stock purchase</summary>
        <form class="inline" id="stock-add-form">
          ${ownerSelect(members, selected)}
          <label>Symbol<input name="symbol" required placeholder="e.g. INFY"></label>
          <label>Company name<input name="name" placeholder="optional"></label>
          <label>Exchange<select name="exchange"><option value="NSE">NSE</option><option value="BSE">BSE</option></select></label>
          <label>Broker<input name="broker" required placeholder="e.g. Zerodha"></label>
          <label>Buy date<input name="initial_txn_date" type="date" required></label>
          <label>Quantity<input name="initial_quantity" type="number" step="0.0001" required></label>
          <label>Price / share<input name="initial_price" type="number" step="0.0001" required></label>
          <label>Charges<input name="initial_charges" type="number" step="0.01" placeholder="0"></label>
          <button type="submit">Save</button>
        </form>
        <div class="error" id="stock-add-error"></div>
      </details>` : NO_MEMBERS_NOTE}
      ${p.rows.length ? `
      <details>
        <summary>Sell (or record a buy on a specific holding)</summary>
        <form class="inline" id="stock-txn-form">
          <label>Holding<select name="asset_id">${holdingOptions}</select></label>
          <label>Type<select name="txn_type"><option value="SELL">Sell</option><option value="BUY">Buy</option></select></label>
          <label>Date<input name="txn_date" type="date" required></label>
          <label>Quantity<input name="quantity" type="number" step="0.0001" required></label>
          <label>Price / share<input name="price" type="number" step="0.0001" required></label>
          <label>Charges<input name="charges" type="number" step="0.01" placeholder="0"></label>
          <button type="submit">Save</button>
        </form>
        <div class="error" id="stock-txn-error"></div>
      </details>
      <details>
        <summary>Update current price manually</summary>
        <form class="inline" id="stock-price-form">
          <label>Holding<select name="asset_id">${holdingOptions}</select></label>
          <label>As of date<input name="price_date" type="date" required></label>
          <label>Price / share<input name="price" type="number" step="0.0001" required></label>
          <button type="submit">Update price</button>
        </form>
        <div class="error" id="stock-price-error"></div>
      </details>
      <details>
        <summary>Set a stock's sector / market cap yourself</summary>
        <form class="inline" id="stock-info-form">
          <label>Stock<select name="symbol">${symbolOptions}</select></label>
          <label>Sector<input name="sector" placeholder="e.g. Information Technology"></label>
          <label>Market cap<select name="cap_category"><option value="LARGE">Large</option><option value="MID">Mid</option><option value="SMALL">Small</option></select></label>
          <button type="submit">Save</button>
        </form>
        <div class="error" id="stock-info-error"></div>
      </details>` : ""}
    </div>`;
  $("#stock-analysis").insertAdjacentHTML("afterbegin", vizStockMap(p));
  const showStockView = () => {
    $("#stock-analysis").style.display = stockView === "ANALYSIS" ? "" : "none";
    $("#stock-holdings").style.display = stockView === "HOLDINGS" ? "" : "none";
    body.querySelectorAll("#stock-views [data-view]").forEach((x) => x.classList.toggle("active", x.dataset.view === stockView));
  };
  body.querySelectorAll("#stock-views [data-view]").forEach((b) => b.addEventListener("click", () => {
    stockView = b.dataset.view;
    showStockView();
  }));
  showStockView();

  wireForm("#stock-add-form", "#stock-add-error", ({ owner_id, ...f }) =>
    postJson(`/api/members/${owner_id}/stocks`, dropEmpty(f, "name", "initial_charges")));

    postJson(`/api/stocks/${asset_id}/transactions`, dropEmpty(f, "charges")));

    postJson(`/api/stocks/${asset_id}/prices`, f));

  wireStockEditor(p, body);

  body.querySelectorAll("tr.group-row").forEach((tr) => tr.addEventListener("click", (e) => {

    const open = tr.firstElementChild.textContent === "▾";

    body.querySelectorAll(`tr[data-part-of="${tr.dataset.group}"]`).forEach((r) => { r.style.display = open ? "none" : ""; });
  }));

  body.querySelectorAll("[data-risk-member]").forEach((sel) => sel.addEventListener("change", async () => {
    try {
      await postJson(`/api/members/${sel.dataset.riskMember}/risk-tolerance`, { risk_tolerance: sel.value });
      await renderApp();
    } catch (err) { alert(err.message); }
  }));

  $("#stock-sync-btn").addEventListener("click", async (e) => {
    const out = $("#stock-sync-result");
    e.target.disabled = true;
    out.textContent = "Fetching closing prices from NSE/BSE…";
    try {
      const { sync: r } = await postJson(`/api/families/${familyId}/stocks/sync`, {});
      if (r.error) {
        out.innerHTML = `<span class="loss">${escapeHtml(r.error)}</span>`;
        e.target.disabled = false;
        return;
      }
      await renderApp();
      const unmatched = r.unmatched.length ? ` · not synced: ${r.unmatched.map(escapeHtml).join("; ")}` : "";
      $("#stock-sync-result").innerHTML =
        `Updated ${r.updated.length}, already current ${r.unchanged.length}${unmatched}`;
    } catch (err) {
      out.innerHTML = `<span class="loss">${escapeHtml(err.message)}</span>`;
      e.target.disabled = false;
    }
  });
}

// The MF tab's editor: a fund's details, today's figures, and every purchase.
function wireMfEditor(p, body) {
  const panel = $("#mf-edit-details");
  if (!panel) return;
  const holdForm = $("#mf-hold-form");
  const figForm = $("#mf-figures-form");
  const txnForm = $("#mf-txn-edit-form");
  let current = null;

  const show = (assetId) => {
    const mf = p.rows.find((r) => r.mf.asset_id === assetId)?.mf;
    if (!mf) return;
    current = mf;
    holdForm.owner_id.value = mf.member_id;
    holdForm.scheme_name.value = mf.scheme_name;
    holdForm.folio_number.value = mf.folio_number;
    holdForm.broker.value = mf.broker ?? "";
    figForm.units.value = Number(mf.units);
    figForm.invested.value = Number(mf.invested_amount);
    figForm.as_of.value = todayIso();
    ["#mf-hold-error", "#mf-figures-error", "#mf-txn-edit-error"].forEach((id) => { $(id).textContent = ""; });
    txnForm.style.display = "none";
    const txns = mf.transactions.filter((t) => t.status === "ACTIVE");
    $("#mf-edit-txns").innerHTML = `<table>
      <thead><tr><th>Date</th><th>Type</th><th class="num">Units</th><th class="num">NAV</th><th class="num">Amount</th><th></th><th></th></tr></thead>
      <tbody>${txns.map((t) => `<tr>
        <td>${fmtDate(t.txn_date)}</td><td>${t.txn_type === "SIP" ? "SIP" : "Lumpsum"}</td>
        <td class="num">${Number(t.units).toLocaleString(undefined, { maximumFractionDigits: 3 })}</td>
        <td class="num">${Number(t.nav).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
        <td class="num">₹${money(t.amount)}</td>
        <td>${t.is_opening_balance
          ? `<span class="badge warn">From CAS</span><div class="empty">everything bought before the statement, in one row</div>`
          : `<span class="empty">${escapeHtml(t.description || "")}</span>`}</td>
        <td style="white-space:nowrap"><button type="button" class="secondary" data-mtxn-edit="${t.mf_txn_id}" style="padding:5px 10px">Edit</button>
          <button type="button" class="secondary" data-mtxn-delete="${t.mf_txn_id}" style="padding:5px 10px">Delete</button></td>
      </tr>`).join("")}</tbody></table>`;
    $("#mf-edit-txns").querySelectorAll("[data-mtxn-edit]").forEach((b) => b.addEventListener("click", () => {
      const t = txns.find((x) => String(x.mf_txn_id) === b.dataset.mtxnEdit);
      txnForm.txn_id.value = t.mf_txn_id;
      txnForm.txn_date.value = t.txn_date;
      txnForm.txn_type.value = t.txn_type;
      txnForm.units.value = Number(t.units);
      txnForm.amount.value = Number(t.amount);
      txnForm.style.display = "";
      txnForm.units.focus();
    }));
    $("#mf-edit-txns").querySelectorAll("[data-mtxn-delete]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("Delete this purchase? The fund's units and cost are worked out again without it.")) return;
      try {
        await postJson(`/api/mf-transactions/${b.dataset.mtxnDelete}/delete`, {});
        await reopen(mf.asset_id);
      } catch (err) { $("#mf-txn-edit-error").textContent = err.message; }
    }));
    panel.style.display = "";
    panel.open = true;
    panel.querySelector("summary").textContent = `Edit ${mf.scheme_name}`;
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // After a change, re-render the tab and open the same fund again.
  const reopen = async (assetId) => {
    await renderApp();
    document.querySelector(`[data-mf-edit="${assetId}"]`)?.click();
  };
  const submit = (form, errorSel, send) => form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form).entries());
    try { await send(f); await reopen(current.asset_id); }
    catch (err) { $(errorSel).textContent = err.message; }
  });

  body.querySelectorAll("[data-mf-edit]").forEach((b) => b.addEventListener("click", () => show(Number(b.dataset.mfEdit))));
  $("#mf-edit-close").addEventListener("click", () => { panel.style.display = "none"; });
  $("#mf-txn-edit-cancel").addEventListener("click", () => { txnForm.style.display = "none"; });
  submit(holdForm, "#mf-hold-error", (f) => postJson(`/api/mfs/${current.asset_id}/update`, f));
  submit(figForm, "#mf-figures-error", (f) => postJson(`/api/mfs/${current.asset_id}/figures`, f));
  submit(txnForm, "#mf-txn-edit-error", ({ txn_id, ...f }) => postJson(`/api/mf-transactions/${txn_id}/update`, f));
  $("#mf-hold-delete").addEventListener("click", async () => {
    if (!confirm(`Delete ${current.scheme_name} and all its purchases? This cannot be undone.`)) return;
    try { await postJson(`/api/mfs/${current.asset_id}/delete`, {}); await renderApp(); }
    catch (err) { $("#mf-hold-error").textContent = err.message; }
  });
}

// The Stocks tab's editor: a holding's details and every buy / sell of it.
function wireStockEditor(p, body) {
  const panel = $("#stock-edit-details");
  if (!panel) return;
  const holdForm = $("#stock-hold-form");
  const txnForm = $("#stock-txn-edit-form");
  let current = null;

  const show = (assetId) => {
    const row = p.rows.find((r) => r.stock.asset_id === assetId);
    if (!row) return;
    current = row.stock;
    const st = current;
    holdForm.owner_id.value = st.member_id;
    holdForm.symbol.value = st.symbol;
    holdForm.name.value = st.name && st.name !== st.symbol ? st.name : "";
    holdForm.exchange.value = st.exchange;
    holdForm.broker.value = st.broker;
    $("#stock-hold-error").textContent = "";
    $("#stock-txn-edit-error").textContent = "";
    txnForm.style.display = "none";
    const txns = st.transactions.filter((t) => t.status === "ACTIVE");
    $("#stock-edit-txns").innerHTML = `<table>
      <thead><tr><th>Date</th><th>Type</th><th class="num">Quantity</th><th class="num">Price</th><th class="num">Charges</th><th></th><th></th></tr></thead>
      <tbody>${txns.map((t) => `<tr>
        <td>${fmtDate(t.txn_date)}</td><td>${t.txn_type === "BUY" ? "Buy" : "Sell"}</td>
        <td class="num">${Number(t.quantity)}</td><td class="num">₹${money(t.price)}</td><td class="num">₹${money(t.charges)}</td>
        <td>${t.is_opening_balance
          ? `<span class="badge warn">From CAS</span><div class="empty">price is the statement's, not what you paid — edit to enter your real buy date and price</div>`
          : `<span class="empty">${escapeHtml(t.description || "")}</span>`}</td>
        <td style="white-space:nowrap"><button type="button" class="secondary" data-txn-edit="${t.stock_txn_id}" style="padding:5px 10px">Edit</button>
          <button type="button" class="secondary" data-txn-delete="${t.stock_txn_id}" style="padding:5px 10px">Delete</button></td>
      </tr>`).join("")}</tbody></table>`;
    $("#stock-edit-txns").querySelectorAll("[data-txn-edit]").forEach((b) => b.addEventListener("click", () => {
      const t = txns.find((x) => String(x.stock_txn_id) === b.dataset.txnEdit);
      txnForm.txn_id.value = t.stock_txn_id;
      txnForm.txn_date.value = t.txn_date;
      txnForm.txn_type.value = t.txn_type;
      txnForm.quantity.value = Number(t.quantity);
      txnForm.price.value = Number(t.price);
      txnForm.charges.value = Number(t.charges) || "";
      txnForm.style.display = "";
      txnForm.price.focus();
    }));
    $("#stock-edit-txns").querySelectorAll("[data-txn-delete]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("Delete this entry? The holding is worked out again without it.")) return;
      try {
        await postJson(`/api/stock-transactions/${b.dataset.txnDelete}/delete`, {});
        await reopen(st.asset_id);
      } catch (err) {
        $("#stock-txn-edit-error").textContent = err.message;
      }
    }));
    panel.style.display = "";
    panel.open = true;
    panel.querySelector("summary").textContent = `Edit ${st.symbol} — ${st.broker}`;
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // After a change, re-render the tab and open the same holding again.
  const reopen = async (assetId) => {
    await renderApp();
    const btn = document.querySelector(`[data-stock-edit="${assetId}"]`);
    if (btn) btn.click();
  };

  body.querySelectorAll("[data-stock-edit]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation();
    show(Number(b.dataset.stockEdit));
  }));
  $("#stock-edit-close").addEventListener("click", () => { panel.style.display = "none"; });
  $("#stock-txn-edit-cancel").addEventListener("click", () => { txnForm.style.display = "none"; });

  holdForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(holdForm).entries());
    try {
      const { stock } = await postJson(`/api/stocks/${current.asset_id}/update`, dropEmpty(f, "name"));
      await reopen(stock.asset_id);
    } catch (err) {
      $("#stock-hold-error").textContent = err.message;
    }
  });
  $("#stock-hold-delete").addEventListener("click", async () => {
    if (!confirm(`Delete ${current.symbol} (${current.broker}) and all its buys and sells? This cannot be undone.`)) return;
    try {
      await postJson(`/api/stocks/${current.asset_id}/delete`, {});
      await renderApp();
    } catch (err) {
      $("#stock-hold-error").textContent = err.message;
    }
  });
  txnForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const { txn_id, ...f } = Object.fromEntries(new FormData(txnForm).entries());
    try {
      await postJson(`/api/stock-transactions/${txn_id}/update`, dropEmpty(f, "charges"));
      await reopen(current.asset_id);
    } catch (err) {
      $("#stock-txn-edit-error").textContent = err.message;
    }
  });
}

    `<td class="gain" title="₹${money(amount)}">${inrShort(amount)} <span class="empty">(${money(pctValue)}%)</span></td>`;

    const fd = r.fd;
    return `<tr>

    <label>Issue date<input name="issue_date" type="date" required></label>
    <label>Maturity date<input name="maturity_date" type="date" required></label>
    <label>Maturity amount<input name="maturity_value" type="number" step="0.01" placeholder="or give interest rate"></label>
    <label>Payout
      <select name="payout_type">
        <option value="MATURITY">At maturity (cumulative)</option>
        <option value="QUARTERLY">Quarterly payout</option>
        <option value="MONTHLY">Monthly payout</option>
        <option value="MANUAL">Manual / other</option>
      </select>
    </label>`;

  body.innerHTML = `
    <div class="totals">
      ${stat("Principal", p.total_principal)}
      ${stat("Current value", p.total_current_value)}
      <div class="stat"><div class="label">Interest earned so far</div>
        <div class="value gain" title="₹${money(p.total_interest_earned_so_far)}">${inrShort(p.total_interest_earned_so_far)}</div>
        <div class="empty">${money(p.total_interest_earned_pct)}% of principal</div></div>
      <div class="stat"><div class="label">Total interest by maturity</div>
        <div class="value gain" title="₹${money(p.total_interest_by_maturity)}">${inrShort(p.total_interest_by_maturity)}</div>
        <div class="empty">${money(p.total_interest_pct)}% of principal</div></div>
      ${textStat("Next maturity", next)}
    </div>
    <p class="empty" style="margin-top:-12px">For an FD paid at maturity, entering either the interest rate or the maturity amount is enough — the other is worked out (quarterly compounding, as banks do). For quarterly / monthly payout FDs the interest goes to your bank account, so their current value stays at the principal; the interest columns show what they earn. Payout amounts are approximate (banks count actual days).</p>
    <div class="card">
      <h3 class="section-title">FDs — ${scopeName(selected)} (${p.rows.length})</h3>
      <table>
        <thead><tr>
          <th>Owner</th><th>Bank</th><th>FD No.</th><th>Principal</th><th>Rate</th>

        </tr></thead>
        <tbody>${rows}</tbody>

  $("#fd-edit-cancel").addEventListener("click", () => { editDetails.style.display = "none"; });

    const fd = p.rows.find((r) => String(r.fd.asset_id) === b.dataset.delete).fd;

    }

          <label>Employer contribution (EPF)<input name="employer_contribution" type="number" step="0.01"></label>
          <label>Interest rate %<input name="interest_rate" type="number" step="0.01"></label>
          <button type="submit">Update</button>
        </form>
        <div class="error" id="pf-update-error"></div>
      </details>` : ""}
    </div>`;
  body.querySelector(".totals")?.insertAdjacentHTML("afterend", vizPf(p));

  wireForm("#pf-add-form", "#pf-add-error", ({ owner_id, ...f }) =>
    postJson(`/api/members/${owner_id}/pf`, dropEmpty(f, "institution", "employer_contribution")));
  wireForm("#pf-update-form", "#pf-update-error", ({ asset_id, ...f }) =>
    postJson(`/api/pf/${asset_id}/update`, dropEmpty(f, "employer_contribution", "interest_rate")));
  wireForm("#pf-edit-form", "#pf-edit-error", ({ asset_id, ...f }) =>
    postJson(`/api/pf/${asset_id}/edit`, dropEmpty(f, "employer_contribution", "institution")));

  const pfEdit = $("#pf-edit-details");
  const pfForm = $("#pf-edit-form");
  body.querySelectorAll("[data-pf-edit]").forEach((b) => b.addEventListener("click", () => {
    const a = p.rows.find((r) => String(r.account.asset_id) === b.dataset.pfEdit).account;
    pfForm.asset_id.value = a.asset_id;
    pfForm.owner_id.value = a.member_id;
    ["account_number", "opened_date", "interest_rate", "employee_contribution", "balance"]
      .forEach((k) => { pfForm[k].value = a[k] ?? ""; });
    pfForm.institution.value = a.institution ?? "";
    pfForm.employer_contribution.value = a.employer_contribution ?? "";
    pfForm.balance_date.value = a.balance_date ?? "";
    pfForm.querySelector("[data-epf-only]").style.display = a.account_type === "EPF" ? "" : "none";
    $("#pf-edit-error").textContent = "";
    pfEdit.style.display = "";
    pfEdit.open = true;
    pfEdit.querySelector("summary").textContent = `Edit ${a.account_type} ${a.account_number}`;
    pfEdit.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
  $("#pf-edit-cancel").addEventListener("click", () => { pfEdit.style.display = "none"; });
  body.querySelectorAll("[data-pf-delete]").forEach((b) => b.addEventListener("click", async () => {
    const a = p.rows.find((r) => String(r.account.asset_id) === b.dataset.pfDelete).account;
    if (!confirm(`Delete the ${a.account_type} account ${a.account_number} and its balances? This cannot be undone.`)) return;
    try {
      await postJson(`/api/pf/${a.asset_id}/delete`, {});
      await renderApp();
    } catch (err) {
      $("#pf-delete-error").textContent = err.message;
    }
  }));

  // Start the update form from the account's current figures.
  const updateForm = $("#pf-update-form");
  if (updateForm) {
    const fill = () => {
      const a = p.rows.find((r) => String(r.account.asset_id) === updateForm.asset_id.value).account;
      updateForm.employee_contribution.value = a.employee_contribution;
      updateForm.employer_contribution.value = a.employer_contribution ?? "";
      updateForm.employer_contribution.disabled = a.account_type === "PPF";
      updateForm.interest_rate.value = a.interest_rate;
    };
    updateForm.asset_id.addEventListener("change", fill);
    fill();
  }
}

    panel.innerHTML = `<div style="margin-top:14px">
      <div class="card-head"><h3 class="section-title">Pros &amp; cons — ${escapeHtml(pol.plan_name || pol.insurer)} · ${escapeHtml(pol.policy_number)} (${escapeHtml(row.owner_name)})</h3>
        <button type="button" class="secondary" id="policy-review-close">Close</button></div>
      ${policyReviewHtml(pol)}</div>`;
    $("#policy-review-close").addEventListener("click", () => { panel.innerHTML = ""; });
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  const insEdit = $("#ins-edit-form"), insEditDetails = $("#ins-edit-details");
  body.querySelectorAll("[data-edit-policy]").forEach((b) => b.addEventListener("click", () => {
    const pol = p.rows.find((r) => String(r.policy.policy_id) === b.dataset.editPolicy).policy;
    insEdit.policy_id.value = pol.policy_id;
    insEdit.owner_id.value = pol.member_id;
    ["insurer", "policy_number", "policy_type", "premium_amount", "premium_frequency", "start_date", "status"]
      .forEach((k) => { insEdit[k].value = pol[k]; });
    insEdit.maturity_date.value = pol.maturity_date ?? "";
    insEdit.sum_assured.value = pol.sum_assured ?? "";
    insEdit.plan_name.value = pol.plan_name ?? "";
    insEdit.nominee.value = pol.nominee ?? "";
    insEdit.premium_paying_term_years.value = pol.premium_paying_term_years ?? "";
    $("#ins-edit-error").textContent = "";
    $("#ins-edit-title").textContent = `Edit policy — ${pol.insurer} ${pol.policy_number}`;
    insEditDetails.style.display = "";
    insEditDetails.open = true;
    insEditDetails.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
  $("#ins-edit-cancel").addEventListener("click", () => { insEditDetails.style.display = "none"; });
  // Both values are replaced on save (blank clears), so start from the
  // policy's current ones.
  const valuesForm = $("#ins-values-form");
  if (valuesForm) {
    const fill = () => {
      const row = p.rows.find((r) => String(r.policy.policy_id) === valuesForm.policy_id.value);
      valuesForm.current_surrender_value.value = row.policy.current_surrender_value ?? "";
      valuesForm.accrued_bonus.value = row.policy.accrued_bonus ?? "";
    };
    valuesForm.policy_id.addEventListener("change", fill);
    fill();
  }
  wireSurrenderCalculator(surrenderRows);
}

// Surrender value estimate: the Engine does the calculation
// (/api/insurance/<id>/surrender-estimate) and nothing is saved until the
// user clicks "Save as surrender value".
function wireSurrenderCalculator(rows) {
  const form = $("#sv-form");
  if (!form) return;
  const hint = (text) => `<span class="empty" style="font-size:.72rem">${text}</span>`;

  const renderFields = () => {
    const pol = rows.find((r) => String(r.policy.policy_id) === form.policy_id.value).policy;
    $("#sv-result").innerHTML = "";
    $("#sv-fields").innerHTML = pol.policy_type === "ULIP" ? `
      <label>Fund value today<input name="fund_value" type="number" step="0.01" required>
        ${hint("from your ULIP statement / insurer app")}</label>` : `
      <label>Premium-paying term (years)<input name="premium_paying_term_years" type="number" min="1" step="1" value="${pol.premium_paying_term_years ?? ""}"
          placeholder="${pol.maturity_date ? "policy term" : "required"}" ${pol.maturity_date ? "" : "required"}>
        ${hint("e.g. 10 for pay-10-years on a 16-year policy")}</label>
      <label>Bonus earned so far<input name="accrued_bonus" type="number" min="0" step="0.01"
          value="${pol.accrued_bonus != null ? Number(pol.accrued_bonus) : ""}" placeholder="0">
        ${hint("vested bonus from the insurer's statement")}</label>
      <label>Installments paid<input name="installments_paid" type="number" min="0" step="1"
          placeholder="${pol.installments_due_so_far}">
        ${hint("blank = all due so far")}</label>
      <label>GSV factor %<input name="gsv_factor_pct" type="number" step="0.01" placeholder="standard scale">
        ${hint("policy document, surrender value table")}</label>
      <label>Bonus cash-value factor<input name="bonus_cash_value_factor" type="number" step="0.0001" placeholder="e.g. 0.18">
        ${hint("policy document; blank = bonus left out of GSV")}</label>
      <label>SSV factor<input name="ssv_factor" type="number" step="0.0001" placeholder="auto">
        ${hint("insurer's factor if you know it")}</label>
      <label>Discount rate %<input name="discount_rate_pct" type="number" step="0.01" placeholder="7">
        ${hint("used for SSV when no factor given")}</label>`;
  };
  form.policy_id.addEventListener("change", renderFields);
  renderFields();

  const line = (label, value) => (value == null ? "" : `<tr><td>${label}</td><td>${value}</td></tr>`);
  const inr = (v) => (v == null ? null : "₹" + money(v));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const { policy_id, ...fields } = Object.fromEntries(new FormData(form).entries());
    $("#sv-error").textContent = "";
    try {
      const { estimate: est } = await postJson(
        `/api/insurance/${policy_id}/surrender-estimate`,
        dropEmpty(fields, ...Object.keys(fields)),
      );
      const working = est.method === "ULIP" ? `
          ${line("Fund value", inr(est.fund_value))}
          ${line("Discontinuance charge", inr(est.discontinuance_charge))}` : `
          ${line("Bonus used", fields.accrued_bonus ? inr(fields.accrued_bonus) : "none")}
          ${line("Premiums paid", est.premiums_paid != null ? `${inr(est.premiums_paid)} (${est.installments_paid} of ${est.installments_payable} installments)` : null)}
          ${line("GSV factor", est.gsv_factor_pct != null ? est.gsv_factor_pct + "%" : null)}
          ${line("Guaranteed surrender value (GSV)", inr(est.gsv))}
          ${line("Paid-up value (incl. bonus)", inr(est.paid_up_value))}
          ${line("SSV factor", est.ssv_factor)}
          ${line("Special surrender value (SSV)", inr(est.ssv))}`;
      $("#sv-result").innerHTML = `
        <div class="card" style="margin-top:10px; max-width:640px">
          <div class="section-title">Estimated surrender value — policy year ${est.policy_year}</div>
          <div class="stat" style="display:inline-block; margin-bottom:10px">
            <div class="label">${est.method === "ULIP" ? "Fund value − charge" : "Higher of GSV and SSV"}</div>
            <div class="value">₹${money(est.estimate)}</div>
          </div>
          <table><tbody>${working}</tbody></table>
          ${est.notes.map((n) => `<p class="empty">${escapeHtml(n)}</p>`).join("")}
          <button type="button" id="sv-save">Save as surrender value</button>
          <span class="error" id="sv-save-error"></span>
        </div>`;
      $("#sv-save").addEventListener("click", async () => {
        const pol = rows.find((r) => String(r.policy.policy_id) === policy_id).policy;
        try {
          // /values replaces both figures: the bonus used in the estimate is saved with it.
          await postJson(`/api/insurance/${policy_id}/values`, dropEmpty({
            current_surrender_value: est.estimate, accrued_bonus: fields.accrued_bonus || pol.accrued_bonus,
          }, "accrued_bonus"));
          await renderApp();
        } catch (err) {
          $("#sv-save-error").textContent = err.message;
        }
      });
    } catch (err) {
      $("#sv-error").textContent = err.message;
    }
  });
}

// ---------------------------------------------------------------- CAS import
// Upload a CAS PDF -> the server reads it and the Engine says what importing
// would do (nothing saved) -> tick -> import. The file stays in this page
// only until then; it is sent again on import and never stored.

const CAS_HELP = "Upload the CAS PDF without its password: open it in Chrome or Edge, enter the password, then Print → Save as PDF. Don't use \"Microsoft Print to PDF\" — it turns the pages into pictures the app can't read.";
const CAS_SECTIONS = [["MF", "Mutual funds"], ["STOCK", "Stocks"], ["GOLD", "Gold (SGB)"], ["INSURANCE", "Insurance"]];
const CAS_ACTION = {
  NEW: ["gain", "New"], UPDATE: ["", "Update"], SAME: ["", "Already there"], CHECK: ["warn", "Check"],
};
let casUpload = null;  // { base64, memberId, name }

function casImportPanel(members, selected) {
  if (!members.length) return "";
  return `<div>
    <details id="cas-details" open>
      <summary>Import CAS statement (NSDL, or CAMS / KFintech mutual fund CAS)</summary>
      <p class="empty" style="margin-top:0">${escapeHtml(CAS_HELP)}</p>
      <p class="empty">From an NSDL CAS: mutual funds, shares, Sovereign Gold Bonds and life policies. From a CAMS / KFintech (MF Central) CAS: mutual funds with their monthly SIPs. You see everything first and choose what to import; importing the same statement again changes nothing.</p>
      <form class="inline" id="cas-form">
        <label>Whose statement<select name="member_id">${members.map((m) =>
          `<option value="${m.member_id}" ${selected && m.member_id === selected.member_id ? "selected" : ""}>${escapeHtml(m.name)}</option>`).join("")}</select></label>
        <label>CAS PDF<input name="file" type="file" accept="application/pdf,.pdf" required></label>
        <button type="submit">Read statement</button>
      </form>
      <div class="error" id="cas-error"></div>
      <div id="cas-preview"></div>
    </details>
  </div>`;
}

function readFileBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.onerror = () => reject(new Error("could not read the file"));
    reader.readAsDataURL(file);
  });
}

function casItemRow(item) {
  const [cls, label] = CAS_ACTION[item.action] || ["", item.action];
  const list = (xs, klass) => xs.length ? `<ul class="${klass}" style="margin:6px 0 0;padding-left:18px">${xs.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : "";
  return `<tr>
    <td style="width:34px">${item.selectable ? `<input type="checkbox" data-cas-key="${escapeHtml(item.key)}" checked aria-label="Import">` : ""}</td>
    <td style="white-space:nowrap"><span class="badge ${cls}">${label}</span></td>
    <td><strong>${escapeHtml(item.title)}</strong><div class="empty">${escapeHtml(item.detail)}</div>
      ${list(item.changes, "")}${list(item.notes, "empty")}
      ${item.needs_start_date ? `<label class="empty" style="display:inline-flex;gap:8px;align-items:center;margin-top:8px">Policy start date
        <input type="date" data-cas-start="${escapeHtml(item.key)}"></label>` : ""}</td>
  </tr>`;
}

function renderCasPreview(pv) {
  const counts = {};
  pv.items.forEach((i) => { counts[i.action] = (counts[i.action] || 0) + 1; });
  const sections = CAS_SECTIONS.map(([code, title]) => {
    const items = pv.items.filter((i) => i.section === code);
    if (!items.length) return "";
    const active = items.filter((i) => i.action !== "SAME");
    const same = items.filter((i) => i.action === "SAME");
    return `<h3 class="section-title" style="margin-top:18px">${title} (${items.length})</h3>
      ${active.length ? `<table><tbody>${active.map(casItemRow).join("")}</tbody></table>` : ""}
      ${same.length ? `<p class="empty">${same.length} already up to date: ${same.map((i) => escapeHtml(i.title)).join(", ")}</p>` : ""}`;
  }).join("");
  const selectable = pv.items.filter((i) => i.selectable).length;
  $("#cas-preview").innerHTML = `
    <div class="sync-line" style="margin-top:14px">
      <span><strong>${escapeHtml(pv.source)}</strong> · ${fmtDate(pv.period_from)} to ${fmtDate(pv.period_to)} · statement of ${escapeHtml(pv.holder_name)}, importing for <strong>${escapeHtml(casUpload.name)}</strong></span>
      <span class="empty">${["NEW", "UPDATE", "CHECK", "SAME"].filter((a) => counts[a]).map((a) => `${counts[a]} ${CAS_ACTION[a][1].toLowerCase()}`).join(" · ")}</span>
    </div>
    ${sections}
    ${selectable ? `<div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">
      <button type="button" id="cas-apply">Import selected</button>
      <span class="empty">Items marked "Check" are not imported — the note says why.</span>
    </div>` : `<p class="empty">Nothing new to import from this statement.</p>`}
    <div class="error" id="cas-apply-error"></div>`;
  const applyBtn = $("#cas-apply");
  if (!applyBtn) return;
  const refreshCount = () => {
    const n = $("#cas-preview").querySelectorAll("[data-cas-key]:checked").length;
    applyBtn.textContent = `Import ${n} selected`;
    applyBtn.disabled = n === 0;
  };
  $("#cas-preview").querySelectorAll("[data-cas-key]").forEach((c) => c.addEventListener("change", refreshCount));
  refreshCount();
  applyBtn.addEventListener("click", async () => {
    const selected = [...$("#cas-preview").querySelectorAll("[data-cas-key]:checked")].map((c) => c.dataset.casKey);
    const starts = {};
    $("#cas-preview").querySelectorAll("[data-cas-start]").forEach((i) => {
      if (selected.includes(i.dataset.casStart) && i.value) starts[i.dataset.casStart] = i.value;
    });
    applyBtn.disabled = true;
    applyBtn.textContent = "Importing…";
    try {
      const { result } = await postJson(`/api/members/${casUpload.memberId}/cas/apply`, {
        pdf_base64: casUpload.base64, selected, policy_start_dates: starts,
      });
      casUpload = null;
      await renderApp();
      const done = document.createElement("div");
      done.className = "sync-line";
      done.textContent = `Imported ${result.items_applied} item${result.items_applied === 1 ? "" : "s"} from the statement.`;
      $("#tab-body").prepend(done);
    } catch (err) {
      $("#cas-apply-error").textContent = err.message;
      refreshCount();
    }
  });
}

function wireCasImport(members) {
  const form = $("#cas-form");
  if (!form) return;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#cas-error").textContent = "";
    $("#cas-preview").innerHTML = `<p class="empty">Reading the statement…</p>`;
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      const file = form.file.files[0];
      if (!file) throw new Error("choose the CAS PDF first");
      const memberId = Number(form.member_id.value);
      casUpload = {
        base64: await readFileBase64(file), memberId,
        name: (members.find((m) => m.member_id === memberId) || {}).name || "",
      };
      const { preview } = await postJson(`/api/members/${memberId}/cas/preview`, { pdf_base64: casUpload.base64 });
      renderCasPreview(preview);
    } catch (err) {
      $("#cas-preview").innerHTML = "";
      $("#cas-error").textContent = err.message;
    } finally {
      button.disabled = false;
    }
  });
}

// A mirror of the family's money: everything comes from the Engine's
// check-up (`/health`); this only lays it out.

const HEALTH_STATUS = {
  GOOD: { label: "Good", color: "var(--gain)", soft: "var(--gain-soft)", mark: "✓" },
  OK: { label: "Okay", color: "var(--warn)", soft: "var(--warn-soft)", mark: "!" },
  ATTENTION: { label: "Needs attention", color: "var(--loss)", soft: "var(--loss-soft)", mark: "✕" },
  MISSING: { label: "Not enough data", color: "var(--muted)", soft: "var(--bg-2)", mark: "?" },
};
const MIX_COLORS = {
  "Equity": "var(--c-principal)", "Debt & FDs": "#0fb5ae", "Gold": "#d4a017",
  "Bank cash": "#94a3b8", "Insurance savings": "#ec4899",
};
let healthView = "nominal";  // projection: nominal / today's money

function scoreRing(score) {
  return `<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="Health score ${score} out of 100">
    <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"
      pathLength="100" stroke-dasharray="${score} ${100 - score}" stroke-dashoffset="25"/>
    <text x="60" y="62" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">${score}</text>
    <text x="60" y="82" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.85)">out of 100</text>
  </svg>`;
}

function projectionChart(h) {
  const pts = h.projection;
  const key = healthView === "today" ? ["as_is_today", "improved_today"] : ["as_is", "improved"];
  const W = 640, H = 250, L = 66, R = 18, T = 16, B = 30;
  const peak = Math.max(...pts.map((pt) => Math.max(Number(pt[key[0]]), Number(pt[key[1]]))), 1);
  const step = niceStep(peak);
  const top = Math.ceil(peak / step) * step;
  const x = (i) => L + (i / (pts.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - Number(v) / top) * (H - T - B);
  const line = (k) => pts.map((pt, i) => `${x(i).toFixed(1)},${y(pt[k]).toFixed(1)}`).join("L");
  const grid = [];
  for (let v = 0; v <= top + 1e-6; v += step) {
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/>
      <text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? inrShort(v) : "0"}</text>`);
  }
  const ticks = pts.map((pt, i) => (pt.year % 5 === 0
    ? `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${pt.year ? "+" + pt.year + " yrs" : "Today"}</text>` : "")).join("");
  const last = pts[pts.length - 1];
  const html = `
    <div class="card-head" style="margin-bottom:6px">
      <div class="key" style="margin:0">
        <span><span class="t-key" style="display:inline-block;width:14px;height:2px;background:var(--c-principal)"></span>With the suggested changes</span>
        <span><span class="t-key" style="display:inline-block;width:14px;height:2px;background:var(--c-interest)"></span>As things are</span>
      </div>
      <div class="seg" id="health-view">
        <button type="button" data-view="nominal" class="${healthView === "nominal" ? "active" : ""}">Rupees then</button>
        <button type="button" data-view="today" class="${healthView === "today" ? "active" : ""}">Today's money</button>
      </div>
    </div>
    <div class="chart-box" id="health-chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected net worth over ${pts.length - 1} years">
        ${grid.join("")}
        <path d="M${line(key[0])}" fill="none" stroke="var(--c-interest)" stroke-width="2"/>
        <path d="M${line(key[1])}" fill="none" stroke="var(--c-principal)" stroke-width="2.5"/>
        <circle cx="${x(pts.length - 1)}" cy="${y(last[key[1]])}" r="4.5" fill="var(--c-principal)" stroke="var(--card)" stroke-width="2"/>
        <circle cx="${x(pts.length - 1)}" cy="${y(last[key[0]])}" r="4.5" fill="var(--c-interest)" stroke="var(--card)" stroke-width="2"/>
        ${ticks}
        <line class="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text)" stroke-width="1" style="display:none"/>
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
      </svg>
      <div class="chart-tip"></div>
    </div>
    <table style="margin-top:8px"><thead><tr><th>Net worth in</th>${[5, 10, 15, 20].map((yr) => `<th class="num">${yr} years</th>`).join("")}</tr></thead>
      <tbody>
        <tr><td>As things are</td>${[5, 10, 15, 20].map((yr) => `<td class="num">${inrShort(pts[yr][key[0]])}</td>`).join("")}</tr>
        <tr><td><strong>With the changes</strong></td>${[5, 10, 15, 20].map((yr) => `<td class="num"><strong>${inrShort(pts[yr][key[1]])}</strong></td>`).join("")}</tr>
        <tr><td class="empty">Difference</td>${[5, 10, 15, 20].map((yr) => `<td class="num gain">+${inrShort(Number(pts[yr][key[1]]) - Number(pts[yr][key[0]]))}</td>`).join("")}</tr>
      </tbody></table>
    ${h.improved_changes.length ? `<p class="empty">"With the changes" assumes: ${h.improved_changes.map(escapeHtml).join("; ")}.</p>` : ""}
    ${h.retirements.map((r) => `<div class="sync-line" style="margin:10px 0 0">
      <span><strong>At ${escapeHtml(r.name)}'s retirement</strong> (age ${r.retirement_age}, in ${r.years} years): about
      <strong>${inrShort(healthView === "today" ? r.improved_today : r.improved)}</strong> with the changes,
      ${inrShort(healthView === "today" ? r.as_is_today : r.as_is)} as things are${healthView === "today" ? " (today's money)" : ""}.</span></div>`).join("")}`;
  const wire = () => wireChartHover($("#health-chart"), {
    count: pts.length, xAt: x, width: W, hitLeft: L, hitRight: W - R,
    head: (i) => (pts[i].year ? `In ${pts[i].year} year${pts[i].year === 1 ? "" : "s"}` : "Today") + (healthView === "today" ? " · today's money" : ""),
    rowsAt: (i) => [
      ["with the changes", inrShort(pts[i][key[1]]), "var(--c-principal)"],
      ["as things are", inrShort(pts[i][key[0]]), "var(--c-interest)"],
    ],
  });
  return { html, wire };
}

// Person by person: stage of life, where their money goes, advice and a
// hand-over checklist (ticks are saved straight away).
function familySection(h, members) {
  if (!h.people.length) return "";
  const stage = { EARNING: "Earning", RETIRED: "Retired", DEPENDENT: "Dependent" };
  const nameOf = (id) => (members.find((x) => x.member_id === id) || {}).name;
  const ageOf = (dob) => {
    if (!dob) return null;
    const d = new Date(dob), t = new Date();
    return t.getFullYear() - d.getFullYear() - ((t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) ? 1 : 0);
  };
  const missing = `<span class="loss">not set</span>`;
  const table = `<table style="margin-bottom:14px">
    <thead><tr><th>Member</th><th>Date of birth</th><th>Stage of life</th><th>Heir</th><th>Retires at</th><th></th></tr></thead>
    <tbody>${members.map((m) => `<tr>
      <td><strong>${escapeHtml(m.name)}</strong><div class="empty">${escapeHtml(m.relationship)}</div></td>
      <td>${m.date_of_birth ? `${fmtDate(m.date_of_birth)}<div class="empty">${ageOf(m.date_of_birth)} years</div>` : missing}</td>
      <td>${m.life_stage ? stage[m.life_stage] : missing}</td>
      <td>${m.heir_member_id ? escapeHtml(nameOf(m.heir_member_id) || "") : '<span class="empty">—</span>'}</td>
      <td>${m.life_stage === "EARNING" ? (m.retirement_age || 60) : '<span class="empty">—</span>'}</td>
      <td><button type="button" class="secondary" data-member-edit="${m.member_id}" style="padding:5px 10px">Edit</button></td>
    </tr>`).join("")}</tbody></table>
    ${memberEditForm(members)}`;
  const flows = h.inheritance.length ? `<div class="flow-row">${h.inheritance.map((f) => `
      <div class="flow"><span>${escapeHtml(f.from_name)}</span><span class="flow-arrow">→</span><span>${escapeHtml(f.to_name)}</span>
        <strong>${inrShort(f.value)}</strong><span class="empty">today</span></div>`).join("")}</div>`
    : `<p class="empty">Set who each person's money passes to (Overview → Edit) to see it here.</p>`;
  const cards = h.people.map((pp) => {
    const done = pp.checklist.filter((c) => c.done).length;
    return `<div class="person-card">
      <div class="pc-head">
        <div><strong>${escapeHtml(pp.name)}</strong>
          <div class="empty">${pp.age != null ? pp.age + " years · " : ""}${escapeHtml(pp.stage_label)}${pp.heir_name ? " · passes to " + escapeHtml(pp.heir_name) : ""}</div></div>
        <div style="text-align:right"><div class="hc-value" style="margin:0;font-size:1.1rem">${inrShort(pp.net_worth)}</div>
          ${Number(pp.inherits) > 0 ? `<div class="empty">+ ${inrShort(pp.inherits)} to come</div>` : ""}</div>
      </div>
      ${pp.advice.length ? `<ul class="pc-advice">${pp.advice.map((a) => `<li>${escapeHtml(a)}</li>`).join("")}</ul>` : ""}
      ${pp.checklist.length ? `<div class="pc-check-head"><span class="pr-label">Hand-over checklist</span><span class="empty pc-progress">${done} of ${pp.checklist.length} done</span></div>
        ${pp.checklist.map((c) => `<label class="pc-check"><input type="checkbox" data-succ-member="${pp.member_id}" data-succ-item="${c.item}" ${c.done ? "checked" : ""}>
          <span>${escapeHtml(c.label)}${c.hint ? `<span class="loss"> — ${escapeHtml(c.hint)}</span>` : ""}</span></label>`).join("")}` : ""}
    </div>`;
  }).join("");
  return `<div class="card">
      <h3 class="section-title">Family &amp; succession</h3>
      <p class="empty" style="margin-top:0">Age and stage of life shape each person's advice — e.g. a retired parent's FDs stay safe and get senior-citizen tips. Set them here.</p>
      ${table}
      ${flows}
      <div class="person-grid">${cards}</div>
      <p class="empty">Nominees let the family collect money quickly; a will decides who finally owns it. Neither predicts anything — they just make the hand-over smooth whenever it happens.</p>
    </div>`;
}

// ---------------------------------------------------------------- Personal plan (Financial Health)
// Everything is computed by the Engine (`get_plan`); this only draws it.

const GOAL_TYPE_LABEL = { EDUCATION: "Education", RETIREMENT: "Retirement", PROPERTY: "House / property",
  EMERGENCY_FUND: "Emergency fund", TRAVEL: "Travel", OTHER: "Other (wedding, car…)" };
const GOAL_STATUS = {
  ON_TRACK: { label: "On track", st: "GOOD" }, CLOSE: { label: "Nearly there", st: "OK" },
  BEHIND: { label: "Behind", st: "ATTENTION" }, DUE: { label: "Due now", st: "MISSING" },
};
const MOVE_COLOR = { GOAL: "var(--accent)", FD: "#0fb5ae", SENIOR: "#8b5cf6", EMERGENCY: "var(--warn)",
  PROTECT: "var(--loss)", COST: "#ec4899", LOAN: "var(--c-interest)", SETUP: "var(--accent)", OTHER: "var(--muted)" };
const PURPOSE_LABEL = { GOALS: "For goals", EMERGENCY: "Emergency", INCOME: "Someone's income", KEEP: "Keep as is", FREE: "Not assigned" };
const PURPOSE_COLOR = { GOALS: "var(--accent)", EMERGENCY: "var(--warn)", INCOME: "#8b5cf6", KEEP: "#94a3b8", FREE: "var(--border-strong)" };
const PRIORITY_LABEL = { 1: "High", 2: "Medium", 3: "Low" };
let planShowAllMoves = false;

function areaTiles(plan) {
  return `<div class="area-grid">${plan.areas.map((a) => {
    const st = HEALTH_STATUS[a.status];
    return `<div class="area-tile" title="${escapeHtml(a.headline)}">
      <div class="a-label">${escapeHtml(a.label)}</div>
      <div class="a-score" style="color:${st.color}">${a.score == null ? "—" : a.score}</div>
      <div class="a-bar"><div style="width:${a.score == null ? 0 : a.score}%;background:${st.color}"></div></div>
      <div class="a-head">${escapeHtml(a.headline)}</div>
    </div>`;
  }).join("")}</div>`;
}

const PLAN_RESULT = {
  COVERED: { label: "Reachable", st: "GOOD" },
  COVERED_WITH_BACKUP: { label: "Needs a choice", st: "OK" },
  SHORT: { label: "Short", st: "ATTENTION" },
};

function goalCards(plan) {
  if (!plan.goals.length) {
    return `<div class="plan-empty"><div style="font-weight:700;font-size:1.05rem">What is the money for?</div>
      <p class="empty">Add a goal — a child's education, a house, retirement — and the app works out the best way to reach it.</p>
      <button type="button" data-goal-new>+ Add your first goal</button></div>`;
  }
  const funding = {};
  (plan.funding ? plan.funding.goals : []).forEach((f) => { funding[f.goal_id] = f; });
  return `<div class="goal-grid">${plan.goals.map((g) => {
    const f = funding[g.goal_id];
    const r = f ? PLAN_RESULT[f.result] : GOAL_STATUS[g.status];
    const st = HEALTH_STATUS[r.st];
    const pct = f ? f.plan_funded_pct : Math.min(g.funded_pct, 100);
    const yrs = Number(g.years_left);
    return `<div class="goal-card">
      <div class="g-top"><div><div class="g-name">${escapeHtml(g.name)}</div>
          <div class="g-sub">${inrShort(g.target_today)} today · ${inrShort(g.future_cost)} by ${fmtDate(g.target_date)}${yrs > 0 ? ` (${yrs >= 1 ? Math.round(yrs) + " yrs" : "< 1 yr"})` : ""}${g.owner_name ? " · " + escapeHtml(g.owner_name) : ""}</div></div>
        <span class="pill-st" style="background:${st.soft};color:${st.color}">${r.label}</span></div>
      <div class="goal-bar" title="${pct}% reachable with the suggested plan"><div style="width:${pct}%;background:${st.color}"></div></div>
      <div style="font-size:.8rem"><strong>${pct}%</strong> <span class="empty">reachable with the suggested plan</span></div>
      ${f ? `<div class="pr-label" style="margin-top:2px">Suggested way</div>
        <ul style="margin:0;padding-left:18px;font-size:.84rem">${f.recommendation.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
        ${f.result !== "COVERED" ? `<div style="font-size:.84rem;background:${st.soft};border-radius:10px;padding:8px 10px">
            <strong style="color:${st.color}">${inrShort(f.shortfall)} short.</strong> Best fix: ${escapeHtml(f.best_fix)}
            ${f.options.length > 1 ? `<details><summary style="padding:4px 0 0;font-size:.76rem">Other choices</summary>
              <ul style="margin:4px 0 0;padding-left:18px">${f.options.slice(1).map((o) => `<li>${escapeHtml(o)}</li>`).join("")}</ul></details>` : ""}
          </div>` : ""}` : ""}
      <div><button type="button" class="secondary" data-goal-edit="${g.goal_id}" style="padding:4px 10px;font-size:.76rem">Edit</button></div>
    </div>`;
  }).join("")}
    <div class="goal-card plan-empty" style="justify-content:center"><button type="button" data-goal-new>+ Add a goal</button></div>
  </div>`;
}

function fundingChips(plan, h) {
  const f = plan.funding;
  if (!f) return "";
  const n = (v) => inrShort(v);
  return `<div class="sync-line" style="margin-bottom:12px">
      <span>From the Monthly Cash Flow tab: income <strong>${n(h.monthly_income)}</strong>
        − spending &amp; EMIs <strong>${n(h.monthly_outgo)}</strong>
        − SIPs already running <strong>${n(h.monthly_investing)}</strong>
        = <strong>${n(f.monthly_free)}</strong> free a month.
        Suggested SIPs use <strong>${n(f.sip_total)}</strong>; <strong>${n(f.monthly_left)}</strong> stays free.</span>

    </div>`;
}

function moveCards(plan) {
  if (!plan.moves.length) return `<p class="empty">Nothing to do right now — nicely done.</p>`;
  const shown = planShowAllMoves ? plan.moves : plan.moves.slice(0, 6);
  return `<div class="move-list">${shown.map((m, i) => `<div class="move-card">
      <div class="m-dot" style="background:${MOVE_COLOR[m.kind] || "var(--muted)"}"></div>
      <div style="flex:1;min-width:0">
        <div class="m-title">${escapeHtml(m.title)} ${m.priority === 1 ? `<span class="badge loss">Do first</span>` : ""}</div>
        <div class="m-line">${escapeHtml(m.line)}</div>
        <div class="m-actions">
          ${m.amount != null && Number(m.amount) > 0 ? `<span class="chip">${inrShort(m.amount)} ${escapeHtml(m.amount_note)}</span>` : ""}
          ${m.impact != null && Number(m.impact) > 0 ? `<span class="chip gain">+${inrShort(m.impact)} ${escapeHtml(m.impact_note)}</span>` : ""}
          ${m.steps.length ? `<button type="button" class="secondary" data-move-how="${i}">How</button>` : ""}
          <button type="button" class="secondary" data-move-dismiss="${escapeHtml(m.key)}" title="Hide this suggestion for good">Not for me</button>
        </div>
        ${m.steps.length ? `<ul data-move-steps="${i}" style="display:none">${m.steps.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}
      </div></div>`).join("")}</div>
    ${plan.moves.length > 6 ? `<button type="button" class="secondary" id="moves-more" style="margin-top:10px">${planShowAllMoves ? "Show fewer" : `Show all ${plan.moves.length}`}</button>` : ""}
    ${plan.hidden.length ? `<details style="margin-top:8px"><summary>${plan.hidden.length} hidden suggestion${plan.hidden.length === 1 ? "" : "s"}</summary>
      ${plan.hidden.map((m) => `<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span>${escapeHtml(m.title)}</span>
        <button type="button" class="secondary" data-move-restore="${escapeHtml(m.key)}" style="padding:3px 9px;font-size:.74rem">Bring back</button></div>`).join("")}</details>` : ""}`;
}

function purposeStrip(plan) {
  const total = plan.purposes.reduce((t, x) => t + Number(x.value), 0);
  if (!total) return "";
  return stackBar(plan.purposes.map((x) => ({
    label: PURPOSE_LABEL[x.purpose], pct: (Number(x.value) / total * 100).toFixed(1),
    color: PURPOSE_COLOR[x.purpose], valueText: inrShort(x.value),
  })));
}

const GOAL_MONEY_LABEL = { YES: "Yes", IF_NEEDED: "Only if needed", NO: "No" };

      <label>Priority<select name="priority"><option value="1">High</option><option value="2" selected>Medium</option><option value="3">Low</option></select></label>

function wirePlan(page, familyId, body) {
  const reload = () => renderApp().catch(showFatal);
  const openSettings = () => { const d = $("#plan-settings"); d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); };
  body.querySelectorAll("[data-move-how]").forEach((b) => b.addEventListener("click", () => {
    const ul = body.querySelector(`[data-move-steps="${b.dataset.moveHow}"]`);
    ul.style.display = ul.style.display === "none" ? "" : "none";
  }));
  body.querySelectorAll("[data-move-dismiss]").forEach((b) => b.addEventListener("click", async () => {
    try { await postJson(`/api/families/${familyId}/moves/dismiss`, { key: b.dataset.moveDismiss, dismissed: true }); reload(); }
    catch (err) { alert(err.message); }
  }));
  body.querySelectorAll("[data-move-restore]").forEach((b) => b.addEventListener("click", async () => {
    try { await postJson(`/api/families/${familyId}/moves/dismiss`, { key: b.dataset.moveRestore, dismissed: false }); reload(); }
    catch (err) { alert(err.message); }
  }));
  $("#moves-more")?.addEventListener("click", () => { planShowAllMoves = !planShowAllMoves; reload(); });

  const form = $("#goal-form");
  const resetGoalForm = () => {
    form.reset(); form.goal_id.value = "";
    $("#goal-form-title").textContent = "Add a goal"; $("#goal-submit").textContent = "Add goal";
    $("#goal-delete").style.display = "none"; $("#goal-cancel").style.display = "none"; $("#goal-error").textContent = "";
  };
  body.querySelectorAll("[data-goal-new]").forEach((b) => b.addEventListener("click", () => { resetGoalForm(); openSettings(); form.name.focus(); }));
  body.querySelectorAll("[data-goal-edit]").forEach((b) => b.addEventListener("click", () => {
    const g = page.goal_records.find((x) => String(x.goal_id) === b.dataset.goalEdit);
    resetGoalForm();
    form.goal_id.value = g.goal_id; form.name.value = g.name; form.goal_type.value = g.goal_type;
    form.target_amount.value = Number(g.target_amount); form.target_date.value = g.target_date;
    form.member_id.value = g.member_id ?? ""; form.priority.value = g.priority || 2;
    form.inflation_pct.value = g.inflation_pct ?? "";
    $("#goal-form-title").textContent = `Edit goal — ${g.name}`; $("#goal-submit").textContent = "Save goal";
    $("#goal-delete").style.display = ""; $("#goal-cancel").style.display = "";
    openSettings();
  }));
  $("#goal-cancel").addEventListener("click", resetGoalForm);
  $("#goal-delete").addEventListener("click", async () => {
    if (!confirm("Delete this goal? Holdings put towards it become unassigned.")) return;
    try { await postJson(`/api/families/${familyId}/goals/${form.goal_id.value}/delete`, {}); reload(); }
    catch (err) { $("#goal-error").textContent = err.message; }
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const { goal_id, ...f } = Object.fromEntries(new FormData(form).entries());
    try {
      await postJson(goal_id ? `/api/families/${familyId}/goals/${goal_id}/update` : `/api/families/${familyId}/goals`,
        dropEmpty(f, "member_id", "inflation_pct"));
      reload();
    } catch (err) { $("#goal-error").textContent = err.message; }
  });

  body.querySelectorAll("[data-purpose-for]").forEach((sel) => {
    sel.value = body.querySelector(`[data-purpose-cur="${sel.dataset.purposeFor}"]`).textContent;
    sel.addEventListener("change", async () => {
      const v = sel.value;
      const payload = v.startsWith("goal:") ? { goal_id: v.slice(5) } : v ? { purpose: v } : {};
      try { await postJson(`/api/assets/${sel.dataset.purposeFor}/purpose`, payload); await renderApp(); openSettings(); }
      catch (err) { $("#purpose-error").textContent = err.message; }
    });
  });
  body.querySelectorAll("[data-goal-money]").forEach((sel) => sel.addEventListener("change", async () => {
    try { await postJson(`/api/members/${sel.dataset.goalMoney}/goal-money`, { goal_money: sel.value }); await renderApp(); openSettings(); }
    catch (err) { $("#goal-money-error").textContent = err.message; }
  }));
  $("#fund-apply")?.addEventListener("click", async (e) => {
    if (!confirm("Keep the holdings the suggested plan uses for their goals? You can change any of them below at any time.")) return;
    e.target.disabled = true;
    try { await postJson(`/api/families/${familyId}/funding-plan/apply`, {}); reload(); }
    catch (err) { alert(err.message); e.target.disabled = false; }
  });
  $("#pref-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    try {
      await postJson(`/api/families/${familyId}/planning-preferences`, { ...f, avoid_direct_stocks: f.avoid_direct_stocks === "on" });
      reload();
    } catch (err) { $("#pref-error").textContent = err.message; }
  });
}

async function renderHealthTab({ familyId, members, selected, body }) {
  const page = await api(`/api/families/${familyId}/plan${memberQuery(selected)}`);
  const h = page.health, plan = page.plan;
  const score = plan.score ?? h.score;
  const saveRate = h.savings_rate_pct == null ? "—" : `${Number(h.savings_rate_pct)}%`;
  const counts = { GOOD: 0, OK: 0, ATTENTION: 0, MISSING: 0 };
  h.checks.forEach((c) => { counts[c.status] += 1; });

  const hero = `
    <div class="hero health-hero">
      <div class="health-score">${scoreRing(score)}</div>
      <div style="flex:1;min-width:240px">

// The Engine sends each loan with its whole month-by-month schedule; this
// tab only picks rows to show and scales amounts into chart geometry.

const LOAN_TYPE_LABEL = {
  HOME_LOAN: "Home loan", CAR_LOAN: "Car loan", PERSONAL_LOAN: "Personal loan",
  EDUCATION_LOAN: "Education loan", OTHER: "Other loan",
};
let currentLoanId = null;  // the loan on screen, kept across re-renders

const fmtMonth = (iso) => {
  const m = /^(\d{4})-(\d{2})/.exec(String(iso || ""));
  return m ? `${MONTH_NAMES[Number(m[2]) - 1]} ${m[1]}` : "—";
};
const plural = (n, word) => `${n} ${word}${Number(n) === 1 ? "" : "s"}`;
function yearsMonths(months) {
  const y = Math.floor(months / 12), m = months % 12;
  return [y ? plural(y, "year") : "", m ? plural(m, "month") : ""].filter(Boolean).join(" ") || "0 months";
}
const loanTitle = (l) => `${LOAN_TYPE_LABEL[l.loan_type] || l.loan_type} · ${l.lender}`;

function loanPhaseText(l) {
  const emiMonths = l.schedule.length - l.pre_emi_months;
  switch (l.phase) {
    case "PRE_EMI": return `Pre-EMI · month ${l.current_month_no} of ${l.pre_emi_months}`;
    case "EMI": return `EMI ${l.current_month_no - l.pre_emi_months} of ${emiMonths}`;
    case "NOT_STARTED": return "Not started yet";
    case "REPAID": return "Repaid";
    default: return "Closed";
  }
}

// A tick step of 1, 2 or 5 x 10^n giving about `count` gridlines.
function niceStep(max, count = 4) {
  const raw = max / count;
  const pow = 10 ** Math.floor(Math.log10(raw || 1));
  return [1, 2, 5, 10].map((f) => f * pow).find((s) => s >= raw) || pow * 10;
}

// Shared hover layer: a hairline that snaps to the nearest point, and one
// tooltip listing every value there. `rowsAt(i)` returns [label, value, color?].
function wireChartHover(box, { count, xAt, width, head, rowsAt, hitLeft, hitRight }) {
  const svg = box.querySelector("svg");
  const tip = box.querySelector(".chart-tip");
  const hair = box.querySelector(".hair");
  if (!svg || !tip || !count) return;
  const show = (clientX) => {
    const rect = svg.getBoundingClientRect();
    const vx = ((clientX - rect.left) / rect.width) * width;
    let best = 0;
    for (let i = 1; i < count; i++) if (Math.abs(xAt(i) - vx) < Math.abs(xAt(best) - vx)) best = i;
    if (vx < hitLeft - 20 || vx > hitRight + 20) { hide(); return; }
    if (hair) { hair.setAttribute("x1", xAt(best)); hair.setAttribute("x2", xAt(best)); hair.style.display = ""; }
    tip.replaceChildren();
    const h = document.createElement("div");
    h.className = "t-head";
    h.textContent = head(best);
    tip.appendChild(h);
    rowsAt(best).forEach(([label, value, color]) => {
      const row = document.createElement("div");
      row.className = "t-row";
      const key = document.createElement("span");
      key.className = "t-key";
      key.style.background = color || "transparent";
      const val = document.createElement("span");
      val.className = "t-val";
      val.textContent = value;
      const name = document.createElement("span");
      name.textContent = label;
      row.append(key, val, name);
      tip.appendChild(row);
    });
    tip.style.display = "block";
    const px = (xAt(best) / width) * rect.width;
    const boxW = box.getBoundingClientRect().width;
    const left = px + 14 + tip.offsetWidth > boxW ? px - 14 - tip.offsetWidth : px + 14;
    tip.style.left = `${Math.max(0, left)}px`;
  };
  const hide = () => { tip.style.display = "none"; if (hair) hair.style.display = "none"; };
  svg.addEventListener("pointermove", (e) => show(e.clientX));
  svg.addEventListener("pointerleave", hide);
}

// Principal still owed, month by month, with today and each prepayment.
function loanBalanceChart(loan) {
  const rows = loan.schedule;
  if (!rows.length) return { html: `<p class="empty">No schedule yet</p>`, wire: () => {} };
  const W = 640, H = 240, L = 62, R = 16, T = 18, B = 30;
  const peak = Math.max(...rows.map((r) => Math.max(Number(r.opening) + Number(r.disbursed), Number(r.closing))), 1);
  const step = niceStep(peak);
  const top = Math.ceil(peak / step) * step;
  const n = rows.length;
  const x = (i) => L + (n === 1 ? 0 : (i / (n - 1)) * (W - L - R));
  const y = (v) => T + (1 - Number(v) / top) * (H - T - B);
  const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.closing).toFixed(1)}`).join("L");
  const grid = [];
  for (let v = 0; v <= top + 1e-6; v += step) {
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
      <text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? inrShort(v) : "0"}</text>`);
  }
  // A label every few Aprils (financial years), at most ~7 of them.
  const aprils = rows.map((r, i) => (r.month.slice(5, 7) === "04" ? i : -1)).filter((i) => i >= 0);
  const every = Math.max(1, Math.ceil(aprils.length / 7));
  const ticks = aprils.filter((_, k) => k % every === 0).map((i) =>
    `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${rows[i].month.slice(0, 4)}</text>`).join("");
  const preEmi = loan.pre_emi_months > 0 && loan.pre_emi_months < n
    ? `<rect x="${L}" y="${T}" width="${x(loan.pre_emi_months) - L}" height="${H - T - B}" fill="var(--bg-2)" opacity=".7"/>
       <text class="axis" x="${L + 4}" y="${H - B - 6}">Pre-EMI</text>` : "";
  const cur = loan.current_month_no;
  const today = cur >= 1 && cur <= n
    ? `<line x1="${x(cur - 1)}" x2="${x(cur - 1)}" y1="${T}" y2="${H - B}" stroke="var(--text-2)" stroke-width="1"/>
       <text class="axis" x="${x(cur - 1) + 5}" y="${T + 13}" style="fill:var(--text-2);font-weight:600">Today</text>` : "";
  const dots = rows.map((r, i) => (Number(r.prepaid) > 0
    ? `<circle cx="${x(i)}" cy="${y(r.closing)}" r="4.5" fill="var(--gain)" stroke="var(--card)" stroke-width="2"/>` : "")).join("");
  const hasPrepay = rows.some((r) => Number(r.prepaid) > 0);
  const html = `
    <div class="key">
      <span><span class="t-key" style="display:inline-block;width:14px;height:2px;background:var(--c-principal)"></span>Principal owed</span>
      ${hasPrepay ? `<span><span class="swatch" style="background:var(--gain);border-radius:50%"></span>Prepayment</span>` : ""}
    </div>
    <div class="chart-box" id="loan-balance-chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Principal owed each month">
        ${preEmi}${grid.join("")}
        <path d="M${pts}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--c-principal)" opacity=".12"/>
        <path d="M${pts}" fill="none" stroke="var(--c-principal)" stroke-width="2" stroke-linejoin="round"/>
        ${today}${dots}${ticks}
        <line class="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text)" stroke-width="1" style="display:none"/>
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
      </svg>
      <div class="chart-tip"></div>
    </div>`;
  const wire = () => wireChartHover($("#loan-balance-chart"), {
    count: n, xAt: x, width: W, hitLeft: L, hitRight: W - R,
    head: (i) => `${fmtMonth(rows[i].month)} · month ${rows[i].month_no}${rows[i].phase === "PRE_EMI" ? " (pre-EMI)" : ""}`,
    rowsAt: (i) => {
      const r = rows[i];
      const out = [["owed at month end", "₹" + money(r.closing), "var(--c-principal)"],
        ["interest", "₹" + money(r.interest), "var(--c-interest)"],
        [r.phase === "PRE_EMI" ? "pre-EMI interest paid" : "EMI paid", "₹" + money(r.payment)]];
      if (Number(r.disbursed) > 0) out.push(["disbursed", "₹" + money(r.disbursed)]);
      if (Number(r.prepaid) > 0) out.push(["prepaid", "₹" + money(r.prepaid), "var(--gain)"]);
      return out;
    },
  });
  return { html, wire };
}

// Interest and principal paid in each financial year, stacked.
function loanYearChart(loan) {
  const fys = loan.financial_years;
  if (!fys.length) return { html: `<p class="empty">No schedule yet</p>`, wire: () => {} };
  const W = 640, H = 240, L = 62, R = 16, T = 14, B = 30;
  const principalOf = (f) => Number(f.principal_repaid) + Number(f.prepaid);
  const peak = Math.max(...fys.map((f) => Number(f.interest) + principalOf(f)), 1);
  const step = niceStep(peak);
  const top = Math.ceil(peak / step) * step;
  const slot = (W - L - R) / fys.length;
  const bw = Math.max(2, Math.min(24, slot * 0.62));
  const cx = (i) => L + slot * (i + 0.5);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  const base = y(0);
  const grid = [];
  for (let v = 0; v <= top + 1e-6; v += step) {
    grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
      <text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? inrShort(v) : "0"}</text>`);
  }
  // Rounded data-end on top, square at the baseline; 2px gap between the parts.
  const topRounded = (x0, y0, w, h) => {
    const r = Math.min(4, w / 2, h);
    return `M${x0},${y0 + h}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + w - r}Q${x0 + w},${y0} ${x0 + w},${y0 + r}V${y0 + h}Z`;
  };
  const nowFy = (() => {
    const d = new Date();
    return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  })();
  const bars = fys.map((f, i) => {
    const p = principalOf(f), it = Number(f.interest);
    const x0 = cx(i) - bw / 2;
    const hp = base - y(p), hi = base - y(it);
    const gap = hp > 0 && hi > 0 ? 2 : 0;
    const principal = hp > 0 ? (hi > 0
      ? `<rect x="${x0}" y="${base - hp}" width="${bw}" height="${hp}" fill="var(--c-principal)"/>`
      : `<path d="${topRounded(x0, base - hp, bw, hp)}" fill="var(--c-principal)"/>`) : "";
    const interest = hi > 0 ? `<path d="${topRounded(x0, base - hp - gap - hi, bw, hi)}" fill="var(--c-interest)"/>` : "";
    return `<g opacity="${f.start_year < nowFy ? 0.55 : 1}">${principal}${interest}</g>`;
  }).join("");
  const every = Math.max(1, Math.ceil(fys.length / 8));
  const ticks = fys.map((f, i) => (i % every === 0
    ? `<text class="axis" x="${cx(i)}" y="${H - 8}" text-anchor="middle">${f.label.replace("FY ", "")}</text>` : "")).join("");
  const html = `
    <div class="key">
      <span><span class="swatch" style="background:var(--c-principal)"></span>Principal (EMI + prepaid)</span>
      <span><span class="swatch" style="background:var(--c-interest)"></span>Interest</span>
      <span>Faded: years gone by</span>
    </div>
    <div class="chart-box" id="loan-year-chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Principal and interest paid each financial year">
        ${grid.join("")}${bars}${ticks}
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
      </svg>
      <div class="chart-tip"></div>
    </div>`;
  const wire = () => wireChartHover($("#loan-year-chart"), {
    count: fys.length, xAt: cx, width: W, hitLeft: L, hitRight: W - R,
    head: (i) => fys[i].label,
    rowsAt: (i) => {
      const f = fys[i];
      const out = [["principal via EMI", "₹" + money(f.principal_repaid), "var(--c-principal)"]];
      if (Number(f.prepaid) > 0) out.push(["prepaid", "₹" + money(f.prepaid), "var(--c-principal)"]);
      out.push(["interest", "₹" + money(f.interest), "var(--c-interest)"]);
      out.push(["owed at year end", "₹" + money(f.closing)]);
      return out;
    },
  });
  return { html, wire };
}
