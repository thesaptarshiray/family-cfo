function loanEventsTable(loan) {
  const todayIso = new Date().toISOString().slice(0, 10);
  const planned = (d) => (d > todayIso ? ` <span class="badge">planned</span>` : "");
  const events = [
    ...loan.disbursements.map((d) => ({
      date: d.disbursement_date, kind: "Disbursement", id: d.disbursement_id, del: "loan-disbursements",
      what: `₹${money(d.amount)}${planned(d.disbursement_date)}`, effect: escapeHtml(d.note || ""),
    })),
    ...loan.prepayments.map((p) => ({
      date: p.prepayment_date, kind: "Prepayment", id: p.prepayment_id, del: "loan-prepayments",
      what: `₹${money(p.amount)}${planned(p.prepayment_date)}`,
      effect: Number(p.applied) < Number(p.amount)
        ? `only ₹${money(p.applied)} was owed`
        : `₹${inrShort(p.outstanding_after).replace("₹", "")} left owing · ${yearsMonths(p.months_left_after)} to go`,
    })),
    ...loan.rate_changes.map((c) => ({
      date: c.effective_date, kind: "Rate change", id: c.rate_change_id, del: "loan-rate-changes",
      what: `${Number(c.old_rate)}% → <strong>${Number(c.new_rate)}%</strong>`, effect: escapeHtml(c.reason || ""),
    })),
  ].sort((a, b) => a.date.localeCompare(b.date));
  return `<table>
    <thead><tr><th>Date</th><th>Event</th><th>Amount / rate</th><th>Effect</th><th></th></tr></thead>
    <tbody>${events.map((e) => `<tr>
      <td>${fmtDate(e.date)}</td><td>${e.kind}</td><td>${e.what}</td><td class="empty">${e.effect}</td>
      <td><button type="button" class="secondary" data-del-kind="${e.del}" data-del-id="${e.id}" data-del-label="${escapeHtml(`${e.kind} of ${fmtDate(e.date)}`)}">Delete</button></td>
    </tr>`).join("")}</tbody></table>`;
}

function loanYearTable(loan) {
  const nowFy = (() => { const d = new Date(); return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; })();
  const dash = (v) => (Number(v) ? "₹" + money(v) : `<span class="empty">—</span>`);
  return `<table>
    <thead><tr><th>Financial year</th><th class="num">Disbursed</th><th class="num">Interest</th>
      <th class="num">Principal (EMI)</th><th class="num">Prepaid</th><th class="num">Paid in the year</th><th class="num">Owed at year end</th></tr></thead>
    <tbody>${loan.financial_years.map((f) => `<tr class="${f.start_year === nowFy ? "now" : f.start_year < nowFy ? "past" : ""}">
      <td>${f.label}</td><td class="num">${dash(f.disbursed)}</td><td class="num">${dash(f.interest)}</td>
      <td class="num">${dash(f.principal_repaid)}</td><td class="num">${dash(f.prepaid)}</td>
      <td class="num">₹${money(Number(f.payment) + Number(f.prepaid))}</td><td class="num">₹${money(f.closing)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function loanMonthTable(loan) {
  const cur = loan.current_month_no;
  const dash = (v) => (Number(v) ? "₹" + money(v) : `<span class="empty">—</span>`);
  return `<table>
    <thead><tr><th>#</th><th>Month</th><th class="num">Opening</th><th class="num">Disbursed</th><th class="num">Rate</th>
      <th class="num">Interest</th><th class="num">Paid</th><th class="num">Principal</th><th class="num">Prepaid</th><th class="num">Closing</th></tr></thead>
    <tbody>${loan.schedule.map((r) => `<tr class="${r.month_no === cur ? "now" : r.month_no < cur ? "past" : ""}">
      <td>${r.month_no}</td><td style="white-space:nowrap">${fmtMonth(r.month)}${r.month_no === loan.pre_emi_months + 1 && loan.pre_emi_months ? ` <span class="badge">1st EMI</span>` : ""}</td>
      <td class="num">₹${money(r.opening)}</td><td class="num">${dash(r.disbursed)}</td><td class="num">${Number(r.rate)}%</td>
      <td class="num">₹${money(r.interest)}</td><td class="num">₹${money(r.payment)}</td>
      <td class="num">${dash(r.principal_repaid)}</td><td class="num">${dash(r.prepaid)}</td><td class="num">₹${money(r.closing)}</td>
    </tr>`).join("")}</tbody></table>`;
}

async function renderLoansTab({ familyId, members, selected, body }) {
  const p = await api(`/api/families/${familyId}/loans${memberQuery(selected)}`);
  const addForm = members.length ? `
      <details id="loan-add-details" ${p.rows.length ? "" : "open"}>
        <summary>Add a loan</summary>
        <form class="inline" id="loan-add-form">
          ${loanFields(members, selected, { adding: true })}
          <button type="submit">Save loan</button>
        </form>
        <p class="empty">A construction-linked home loan: give the first disbursement here, then add each later stage as a disbursement. Pre-EMI months are the months you pay interest only, before the EMI starts. Leave the bank's EMI blank if it isn't fixed yet.</p>
        <div class="error" id="loan-add-error"></div>
      </details>` : NO_MEMBERS_NOTE;

  if (!p.rows.length) {
    body.innerHTML = `<div class="card">
      <h3 class="section-title">No loans for ${scopeName(selected)} yet</h3>
      <p class="empty">Add a home, car, personal or education loan to see its full amortization: what you owe each month, interest vs principal, and what prepaying would save.</p>
      ${addForm}</div>`;
    wireLoanTypeFields($("#loan-add-form"));
    wireForm("#loan-add-form", "#loan-add-error", ({ owner_id, ...f }) =>
      postJson(`/api/members/${owner_id}/loans`, dropEmpty(f, "first_disbursement", "emi_amount", "down_payment")));
    return;
  }

  const row = p.rows.find((r) => r.loan.liability_id === currentLoanId)
    || p.rows.find((r) => r.loan.status === "ACTIVE") || p.rows[0];
  currentLoanId = row.loan.liability_id;
  const loan = row.loan;

  // The loan picker, grouped by type.
  const types = [...new Set(p.rows.map((r) => r.loan.loan_type))];
  const picker = `<div class="loan-picker">
      <select id="loan-pick" aria-label="Loan">
        ${types.map((t) => `<optgroup label="${LOAN_TYPE_LABEL[t] || t}">${p.rows.filter((r) => r.loan.loan_type === t).map((r) =>
          `<option value="${r.loan.liability_id}" ${r.loan.liability_id === loan.liability_id ? "selected" : ""}>${escapeHtml(r.loan.lender)} — ${escapeHtml(r.owner_name)}${r.loan.status === "CLOSED" ? " (closed)" : ""}</option>`).join("")}</optgroup>`).join("")}
      </select>
      <span class="count">${plural(p.rows.length, "loan")} for ${scopeName(selected)}</span>
    </div>`;

  const totals = p.rows.length > 1 ? `
    <div class="totals">
      ${stat("Owed on all loans", p.total_outstanding)}
      ${stat("Paid this month", p.this_month_payment)}
      ${stat("Interest paid so far", p.total_interest_paid_to_date)}
      ${stat("Interest still to pay", p.total_interest_remaining)}
    </div>` : "";

  const emiLine = loan.emi == null ? "no EMI yet"
    : `EMI <strong>₹${money(loan.emi)}</strong>${loan.emi_entered ? "" : " (worked out)"}${loan.pre_emi_months ? ` from ${fmtMonth(loan.first_emi_month)}` : ""}`;
  const payoff = loan.payoff_month
    ? `ends <strong>${fmtMonth(loan.payoff_month)}</strong>${loan.months_remaining ? ` · ${yearsMonths(loan.months_remaining)} to go` : ""}`
    : "not repaid at this EMI";
  const hero = `
    <div class="hero">
      <div class="hero-label">${escapeHtml(loanTitle(loan))} · ${escapeHtml(row.owner_name)}<span class="pill phase">${loanPhaseText(loan)}</span></div>
      <div class="hero-value" title="₹${money(loan.outstanding)}">${inrShort(loan.outstanding)}</div>
      <div class="hero-sub">owed at the end of ${fmtMonth(new Date().toISOString())} · ${emiLine} · ${Number(loan.interest_rate)}% ${loan.interest_type.toLowerCase()} · ${payoff}</div>
      <div class="hero-grid">
        <div class="hero-kv"><div class="k">${loan.phase === "PRE_EMI" ? "Pre-EMI interest this month" : "Paid this month"}</div><div class="v">₹${money(loan.this_month_payment)}</div></div>
        <div class="hero-kv"><div class="k">Interest paid so far</div><div class="v">${inrShort(loan.interest_paid_to_date)}</div></div>
        <div class="hero-kv"><div class="k">Total interest (whole loan)</div><div class="v">${inrShort(loan.total_interest)}</div></div>
        ${Number(loan.prepaid_to_date) > 0 || loan.prepayments.length ? `<div class="hero-kv"><div class="k">Saved by prepaying</div><div class="v">${inrShort(loan.interest_saved_by_prepayments)}${loan.months_saved_by_prepayments > 0 ? ` · ${loan.months_saved_by_prepayments} mo` : ""}</div></div>` : ""}
      </div>
    </div>`;

  const sanctioned = Number(loan.sanctioned_amount) || 1;
  const disbursedPct = (Number(loan.disbursed_to_date) / sanctioned) * 100;
  const plannedPct = ((Number(loan.total_disbursed) - Number(loan.disbursed_to_date)) / sanctioned) * 100;
  const repaid = Number(loan.disbursed_to_date) - Number(loan.outstanding);
  const repaidPct = Number(loan.disbursed_to_date) ? (repaid / Number(loan.disbursed_to_date)) * 100 : 0;
  const costDonut = donut([
    { label: "Principal", pct: (Number(loan.total_disbursed) / (Number(loan.total_disbursed) + Number(loan.total_interest) || 1)) * 100,
      color: "var(--c-principal)", valueText: inrShort(loan.total_disbursed) },
    { label: "Interest", pct: (Number(loan.total_interest) / (Number(loan.total_disbursed) + Number(loan.total_interest) || 1)) * 100,
      color: "var(--c-interest)", valueText: inrShort(loan.total_interest) },
  ], { centerTop: inrShort(Number(loan.total_disbursed) + Number(loan.total_interest)), centerBottom: "you pay in all", size: 150 });
  const progress = `
    <div class="card">
      <h3 class="section-title">Where the loan stands</h3>
      ${loan.warnings.map((w) => `<p class="loan-warn"><span class="badge warn">Check</span>${escapeHtml(w)}</p>`).join("")}
      <div class="meter-label"><span>Disbursed <strong>₹${money(loan.disbursed_to_date)}</strong> of ₹${money(loan.sanctioned_amount)} sanctioned</span>
        <span>${Number(loan.undisbursed) > 0 ? `₹${money(loan.undisbursed)} not entered yet` : "fully disbursed"}</span></div>
      ${stackBar([
        { label: "Disbursed", pct: disbursedPct, color: "var(--c-principal)", valueText: inrShort(loan.disbursed_to_date) },
        { label: "Planned", pct: plannedPct, color: "var(--accent-2)", valueText: inrShort(Number(loan.total_disbursed) - Number(loan.disbursed_to_date)) },
      ])}
      <div class="meter-label"><span>Principal repaid <strong>₹${money(Math.max(repaid, 0))}</strong></span>
        <span>${money(Math.max(repaidPct, 0))}% of what was disbursed · incl. ₹${money(loan.prepaid_to_date)} prepaid</span></div>
      <div class="bar-track"><span class="bar-fill" style="width:${Math.min(Math.max(repaidPct, 0), 100)}%;background:var(--gain)"></span></div>
      <h3 class="section-title" style="margin-top:22px">What the whole loan costs</h3>
      ${costDonut}
      ${loan.down_payment != null ? `<p class="empty">Plus your down payment (paid to seller) of ₹${money(loan.down_payment)}.</p>` : ""}
    </div>`;

  const balance = loanBalanceChart(loan);
  const years = loanYearChart(loan);
  const undisbursedNote = Number(loan.undisbursed) > 0 && loan.status === "ACTIVE"
    ? `<p class="empty" style="margin-top:10px">₹${money(loan.undisbursed)} of the sanctioned amount isn't entered as a disbursement yet, so the schedule leaves it out. Add the expected stages (future dates are fine) for the full picture.${loan.emi_entered ? "" : " Until then the EMI is worked out on what has been disbursed; enter the bank's EMI once it is fixed."}</p>` : "";

  const todayIso = new Date().toISOString().slice(0, 10);
  body.innerHTML = `
    ${picker}
    ${totals}
    ${hero}
    <div class="grid-2 viz-row">
      <div class="card"><h3 class="section-title">Principal owed, month by month</h3>${balance.html}${undisbursedNote}</div>
      ${progress}
    </div>
    <div class="grid-2 viz-row">
      <div class="card"><h3 class="section-title">Principal vs interest, by financial year</h3>${years.html}</div>
      <div class="card">
        <h3 class="section-title">What if I prepay?</h3>
        <p class="empty" style="margin-top:0">Try a one-time prepayment, a bit extra every month, or both. Nothing is saved.</p>
        <form class="inline" id="loan-whatif-form">
          <label>Prepay once<input name="amount" type="number" step="0.01" min="0" placeholder="e.g. 500000"></label>
          <label>On<input name="date" type="date" value="${todayIso}" required></label>
          <label>Extra every month<input name="extra_monthly" type="number" step="0.01" min="0" placeholder="optional"></label>
          <button type="submit">Work it out</button>
        </form>
        <div class="error" id="loan-whatif-error"></div>
        <div id="loan-whatif-out"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3 class="section-title">Amortization schedule</h3>
        <div class="seg" id="loan-view">
          <button type="button" data-view="fy" class="active">By financial year</button>
          <button type="button" data-view="month">Month by month</button>
        </div>
      </div>
      <div class="table-wrap schedule-scroll" id="loan-table">${loanYearTable(loan)}</div>
      ${loan.loan_type === "HOME_LOAN" ? `<p class="empty">Financial years run April to March, the way income tax counts them: the interest and principal columns are what a home loan's tax deductions are based on.</p>` : ""}
    </div>
    <div class="card">
      <h3 class="section-title">Disbursements, prepayments and rate changes</h3>
      ${loanEventsTable(loan)}
      <div class="error" id="loan-event-error"></div>
      <details>
        <summary>Add a disbursement</summary>
        <form class="inline" id="loan-disb-form">
          <label>Date<input name="date" type="date" required></label>
          <label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label>
          <label>Note<input name="note" placeholder="e.g. slab 3"></label>
          <button type="submit">Add</button>
        </form>
        <div class="error" id="loan-disb-error"></div>
      </details>
      <details>
        <summary>Add a prepayment</summary>
        <form class="inline" id="loan-prepay-form">
          <label>Date<input name="date" type="date" required></label>
          <label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label>
          <button type="submit">Add</button>
        </form>
        <p class="empty">After the EMI starts, a prepayment keeps the EMI the same and shortens the loan.</p>
        <div class="error" id="loan-prepay-error"></div>
      </details>
      <details>
        <summary>The bank changed the interest rate</summary>
        <form class="inline" id="loan-rate-form">
          <label>From<input name="date" type="date" required></label>
          <label>New rate %<input name="rate" type="number" step="0.01" min="0" required></label>
          <label>Reason<input name="reason" placeholder="e.g. repo rate cut"></label>
          <button type="submit">Save</button>
        </form>
        <p class="empty">The EMI stays the same and the loan gets shorter or longer, which is what banks do unless you ask them to change the EMI.</p>
        <div class="error" id="loan-rate-error"></div>
      </details>
    </div>
    <div class="card">
      <h3 class="section-title">Loan details</h3>
      <details id="loan-edit-details">
        <summary>Edit ${escapeHtml(loanTitle(loan))}</summary>
        <form class="inline" id="loan-edit-form">
          ${loanFields(members, null, { adding: false })}
          <button type="submit">Save changes</button>
          <button type="button" class="secondary" id="loan-delete">Delete loan</button>
        </form>
        <div class="error" id="loan-edit-error"></div>
      </details>
      ${addForm}
    </div>`;

  balance.wire();
  years.wire();

  $("#loan-pick").addEventListener("change", (e) => {
    currentLoanId = Number(e.target.value);
    renderApp().catch(showFatal);
  });

  $("#loan-view").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    $("#loan-view").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    const wrap = $("#loan-table");
    wrap.innerHTML = b.dataset.view === "fy" ? loanYearTable(loan) : loanMonthTable(loan);
    const now = wrap.querySelector("tr.now");
    wrap.scrollTop = now ? Math.max(now.offsetTop - 80, 0) : 0;
  }));

  const add = $("#loan-add-form");
  wireLoanTypeFields(add);
  wireForm("#loan-add-form", "#loan-add-error", async ({ owner_id, ...f }) => {
    const r = await postJson(`/api/members/${owner_id}/loans`, dropEmpty(f, "first_disbursement", "emi_amount", "down_payment"));
    currentLoanId = r.loan.liability_id;
  });

  const edit = $("#loan-edit-form");
  edit.owner_id.value = loan.member_id;
  edit.loan_type.value = loan.loan_type;
  edit.lender.value = loan.lender;
  edit.sanctioned_amount.value = loan.sanctioned_amount;
  edit.interest_rate.value = Number(loan.initial_interest_rate);
  edit.interest_type.value = loan.interest_type;
  edit.tenure_months.value = loan.tenure_months;
  edit.start_date.value = loan.start_date;
  edit.pre_emi_months.value = loan.pre_emi_months;
  edit.emi_amount.value = loan.emi_entered ? loan.emi : "";
  edit.down_payment.value = loan.down_payment ?? "";
  edit.status.value = loan.status;
  wireLoanTypeFields(edit);
  wireForm("#loan-edit-form", "#loan-edit-error", (f) =>
    postJson(`/api/loans/${loan.liability_id}/update`, dropEmpty(f, "emi_amount", "down_payment")));
  $("#loan-delete").addEventListener("click", async () => {
    if (!confirm(`Delete ${loanTitle(loan)} and all its disbursements, prepayments and rate changes? This cannot be undone.`)) return;
    try {
      await postJson(`/api/loans/${loan.liability_id}/delete`, {});
      currentLoanId = null;
      await renderApp();
    } catch (err) {
      $("#loan-edit-error").textContent = err.message;
    }
  });

  wireForm("#loan-disb-form", "#loan-disb-error", (f) =>
    postJson(`/api/loans/${loan.liability_id}/disbursements`, dropEmpty(f, "note")));
  wireForm("#loan-prepay-form", "#loan-prepay-error", (f) =>
    postJson(`/api/loans/${loan.liability_id}/prepayments`, f));
  wireForm("#loan-rate-form", "#loan-rate-error", (f) =>
    postJson(`/api/loans/${loan.liability_id}/rate-changes`, dropEmpty(f, "reason")));

  body.querySelectorAll("[data-del-kind]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm(`Delete the ${b.dataset.delLabel}?`)) return;
    try {
      await postJson(`/api/${b.dataset.delKind}/${b.dataset.delId}/delete`, {});
      await renderApp();
    } catch (err) {
      $("#loan-event-error").textContent = err.message;
    }
  }));

  $("#loan-whatif-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    $("#loan-whatif-error").textContent = "";
    try {
      const { what_if: w } = await postJson(`/api/loans/${loan.liability_id}/what-if`, dropEmpty(f, "amount", "extra_monthly"));
      const emiChanged = w.emi_before !== w.emi_after && w.emi_after != null;
      $("#loan-whatif-out").innerHTML = `<div class="what-if-out">
        <div class="stat"><div class="label">Interest saved</div><div class="value gain">${inrShort(w.interest_saved)}</div><div class="sub">₹${money(w.interest_saved)}</div></div>
        <div class="stat"><div class="label">Loan ends</div><div class="value small">${w.payoff_after ? fmtMonth(w.payoff_after) : "—"}</div>
          <div class="sub">instead of ${w.payoff_before ? fmtMonth(w.payoff_before) : "—"}${w.months_saved > 0 ? ` · ${yearsMonths(w.months_saved)} sooner` : ""}</div></div>
        ${emiChanged ? `<div class="stat"><div class="label">EMI becomes</div><div class="value small">₹${money(w.emi_after)}</div><div class="sub">instead of ₹${money(w.emi_before)} (prepaid before the EMI starts)</div></div>` : ""}
      </div>`;
    } catch (err) {
      $("#loan-whatif-error").textContent = err.message;
    }
  });
}

main().catch(showFatal);
</script>
</body>
</html>
