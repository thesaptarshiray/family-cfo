<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family CFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------ tokens */
  :root {
    --bg: #f4f5fb; --bg-2: #eceef8; --card: #ffffff; --card-2: #f8f9fe;
    --border: #e4e6f1; --border-strong: #d3d6e6;
    --text: #151937; --text-2: #3a3f63; --muted: #7a7f9d;
    --accent: #5b5bf0; --accent-2: #7c4dff; --accent-soft: #eeeefe; --accent-ink: #3f3fd1;
    --gain: #0f9f6e; --gain-soft: #e3f7ef; --loss: #e0445e; --loss-soft: #fdecef;
    --warn: #d98a00; --warn-soft: #fff4dc;
    --c-principal: #5b5bf0; --c-interest: #d97706;  /* loan charts */
    --sidebar: #12143a; --sidebar-2: #1b1e4d; --sidebar-text: #c7c9ee; --sidebar-muted: #8589c4;
    --shadow: 0 1px 2px rgba(20, 22, 60, .04), 0 6px 20px rgba(20, 22, 60, .06);
    --shadow-lg: 0 12px 40px rgba(40, 30, 140, .18);
    --radius: 16px; --radius-sm: 10px;
    --hero: linear-gradient(135deg, #5b5bf0 0%, #7c4dff 55%, #a45cff 100%);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0e22; --bg-2: #121433; --card: #161938; --card-2: #1b1f44;
    --border: #262a55; --border-strong: #343970;
    --text: #eceefe; --text-2: #c3c6ea; --muted: #8b8fbd;
    --accent: #8083ff; --accent-2: #a07cff; --accent-soft: #23265a; --accent-ink: #b3b5ff;
    --gain: #34d399; --gain-soft: #0f3a2e; --loss: #fb7185; --loss-soft: #45182a;
    --warn: #fbbf24; --warn-soft: #3d2e0b;
    --c-principal: #8083ff; --c-interest: #fbbf24;
    --sidebar: #090a1c; --sidebar-2: #14163a; --sidebar-text: #c7c9ee; --sidebar-muted: #7074ad;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e22; --bg-2: #121433; --card: #161938; --card-2: #1b1f44;
      --border: #262a55; --border-strong: #343970;
      --text: #eceefe; --text-2: #c3c6ea; --muted: #8b8fbd;
      --accent: #8083ff; --accent-2: #a07cff; --accent-soft: #23265a; --accent-ink: #b3b5ff;
      --gain: #34d399; --gain-soft: #0f3a2e; --loss: #fb7185; --loss-soft: #45182a;
      --warn: #fbbf24; --warn-soft: #3d2e0b;
      --c-principal: #8083ff; --c-interest: #fbbf24;
      --sidebar: #090a1c; --sidebar-2: #14163a; --sidebar-text: #c7c9ee; --sidebar-muted: #7074ad;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }

  /* ------------------------------------------------------------ base */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
  }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .subtitle { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }
  .gain { color: var(--gain); } .loss { color: var(--loss); }
  .muted, .empty { color: var(--muted); }
  .empty { font-size: .86rem; }
  p.empty { margin: 8px 0; }

  /* ------------------------------------------------------------ shell */
  .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar {
    background: linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%);
    color: var(--sidebar-text); padding: 22px 14px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 11px; background: var(--hero);
    display: grid; place-items: center; color: #fff; box-shadow: 0 6px 18px rgba(124, 77, 255, .45);
  }
  .brand-name { font-weight: 700; color: #fff; font-size: 1.02rem; letter-spacing: -.01em; }
  .brand-sub { font-size: .74rem; color: var(--sidebar-muted); }
  .nav-section { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--sidebar-muted); padding: 14px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
    color: var(--sidebar-text); cursor: pointer; font-weight: 500; font-size: .9rem;
    border: none; background: none; width: 100%; text-align: left; transition: background .15s, color .15s;
  }
  .nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .85; }
  .nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .nav-item.active { background: linear-gradient(90deg, rgba(128, 131, 255, .28), rgba(128, 131, 255, .08)); color: #fff; box-shadow: inset 3px 0 0 #8f91ff; }
  .nav-item.active svg { opacity: 1; }
  .sidebar-foot { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 4px; }

  .main { padding: 26px 34px 60px; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }

  /* member chips */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters button {
    background: var(--card); color: var(--text-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; font-weight: 500; box-shadow: none;
  }
  .filters button:hover { border-color: var(--accent); color: var(--accent-ink); opacity: 1; }
  .filters button.active { background: var(--text); color: var(--card); border-color: var(--text); }
  :root[data-theme="dark"] .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters label { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; color: var(--text-2); }
  .chip-avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .68rem; font-weight: 700; color: #fff; margin: -2px 6px -2px -6px; vertical-align: middle; }

  /* ------------------------------------------------------------ cards & KPIs */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .section-title {
    font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin: 0 0 14px; display: flex; align-items: center; gap: 8px;
  }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-width: 0;
  }
  .stat .label { color: var(--muted); font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .stat .value { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .value.small { font-size: 1.05rem; white-space: normal; }
  .stat .sub { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .stat::after {
    content: ""; position: absolute; right: -24px; top: -24px; width: 80px; height: 80px;
    border-radius: 50%; background: var(--accent-soft); opacity: .7;
  }
  .stat > * { position: relative; z-index: 1; }

  /* the big gradient card at the top of a page */
  .hero {
    background: var(--hero); color: #fff; border-radius: 20px; padding: 24px 26px;
    box-shadow: var(--shadow-lg); position: relative; overflow: hidden; margin-bottom: 18px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .09);
  }
  .hero::before { width: 260px; height: 260px; right: -60px; top: -110px; }
  .hero::after { width: 180px; height: 180px; right: 120px; bottom: -120px; }
  .hero > * { position: relative; z-index: 1; }
  .hero .hero-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; opacity: .85; font-weight: 600; }
  .hero .hero-value { font-size: 2.5rem; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 2px; }
  .hero .hero-sub { opacity: .9; font-size: .92rem; }
  .hero-grid { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 16px; }
  .hero-kv .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
  .hero-kv .v { font-size: 1.1rem; font-weight: 700; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .pill.gain { background: var(--gain-soft); } .pill.loss { background: var(--loss-soft); }
  .hero .pill { background: rgba(255, 255, 255, .18); color: #fff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .72rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.gain { background: var(--gain-soft); color: var(--gain); }
  .badge.loss { background: var(--loss-soft); color: var(--loss); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .grid-2 > .card, .grid-3 > .card { margin-bottom: 0; }
  .viz-row { margin-bottom: 18px; }

  /* ------------------------------------------------------------ tables */
  .table-wrap { overflow-x: auto; margin: 0 -4px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .87rem; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th {
    color: var(--muted); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
    background: var(--card-2); position: sticky; top: 0;
  }
  th:first-child { border-top-left-radius: 10px; } th:last-child { border-top-right-radius: 10px; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--card-2); }
  tbody tr:last-child td { border-bottom: none; }
  td .empty { font-size: .78rem; }

  /* ------------------------------------------------------------ forms & buttons */
  details {
    margin-top: 12px; border: 1px dashed var(--border-strong); border-radius: 12px; padding: 0 14px;
    background: var(--card-2);
  }
  details[open] { padding-bottom: 14px; border-style: solid; }
  summary {
    cursor: pointer; color: var(--accent-ink); font-weight: 600; font-size: .88rem; padding: 12px 0;
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); font-weight: 700; }
  details[open] > summary::before { content: "–"; }
  form.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 4px; }
  form.inline label { display: flex; flex-direction: column; font-size: .74rem; font-weight: 600; color: var(--muted); gap: 5px; }
  input, select {
    border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px 10px; font-size: .88rem;
    min-width: 120px; background: var(--card); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { min-width: 0; width: 16px; height: 16px; accent-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 16px;
    font-size: .86rem; font-weight: 600; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 12px rgba(91, 91, 240, .25); transition: transform .1s, box-shadow .15s, opacity .15s;
  }
  button:hover { opacity: .94; box-shadow: 0 6px 16px rgba(91, 91, 240, .32); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  button.secondary { background: var(--card); color: var(--accent-ink); border: 1px solid var(--border-strong); box-shadow: none; }
  button.secondary:hover { border-color: var(--accent); }
  .sidebar button.nav-item { box-shadow: none; }
  .error { color: var(--loss); font-size: .85rem; margin-top: 8px; }
  .sync-line {
    font-size: .85rem; color: var(--muted); margin-bottom: 16px; display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  }
  .sync-line::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gain); box-shadow: 0 0 0 4px var(--gain-soft); }

  /* ------------------------------------------------------------ charts */
  .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .donut-wrap svg { flex: 0 0 auto; }
  .legend { list-style: none; padding: 0; margin: 0; font-size: .85rem; display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 180px; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .legend .lg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .lg-val { font-weight: 600; }
  .legend .lg-pct { color: var(--muted); width: 56px; text-align: right; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: 0 0 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; padding: 5px 0; }
  .bar-label { flex: 0 0 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .bar-track { flex: 1; height: 10px; background: var(--bg-2); border-radius: 999px; overflow: hidden; display: flex; }
  .bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .bar-value { flex: 0 0 auto; white-space: nowrap; font-weight: 600; min-width: 64px; text-align: right; }
  .bar-value .empty { font-weight: 400; }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--bg-2); gap: 2px; }
  .stack > span { display: block; height: 100%; }
  .dual { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .dual .bar-track { height: 8px; flex: 0 0 8px; }
  .dual .bar-fill.b { background: linear-gradient(90deg, var(--gain), #38d9a9); }
  .dual .bar-fill.b.down { background: linear-gradient(90deg, var(--loss), #ff8fa3); }
  .key { display: flex; gap: 16px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }

  .snapshot { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .snap-box { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--card-2); min-width: 0; }
  .snap-box .donut-wrap { justify-content: center; }
  .snap-box .legend { min-width: 100%; }
  .snap-box .bar-row { justify-content: space-between; }
  .snap-box .bar-label { flex: 1 1 auto; }
  .pie-title { font-weight: 700; margin-bottom: 10px; font-size: .92rem; }
  .risk-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: .88rem; display: flex; flex-direction: column; gap: 6px; background: var(--card-2); }
  .risk-card select { min-width: 0; }

  /* treemap-style blocks for stocks */
  .blocks { display: flex; flex-wrap: wrap; gap: 6px; }
  .block {
    border-radius: 12px; padding: 10px 12px; color: #fff; min-height: 74px; display: flex; flex-direction: column;
    justify-content: space-between; min-width: 92px; flex-grow: 1; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
  }
  .block .b-sym { font-weight: 700; font-size: .92rem; }
  .block .b-sub { font-size: .75rem; opacity: .9; }


  /* 12-month premium calendar */
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .month { border-radius: 10px; padding: 8px 4px; text-align: center; background: var(--bg-2); font-size: .72rem; color: var(--muted); min-height: 64px; }
  .month .m-name { font-weight: 700; color: var(--text-2); }
  .month.due { background: var(--accent-soft); color: var(--accent-ink); }
  .month.due .m-amt { font-weight: 700; margin-top: 4px; font-size: .74rem; }
  .month.now { box-shadow: inset 0 0 0 2px var(--accent); }

  /* members on the overview */
  .member-tile { display: flex; gap: 14px; align-items: center; }
  .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.05rem; flex: 0 0 44px; }

  /* auth screens */
  .setup {
    max-width: 420px; margin: 9vh auto; background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 34px; box-shadow: var(--shadow-lg);
  }
  .setup .brand-mark { margin-bottom: 18px; width: 48px; height: 48px; border-radius: 14px; }
  .setup h1 { margin-bottom: 4px; }
  .setup form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .setup label { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .setup input { width: 100%; padding: 11px 12px; }
  .setup button { padding: 11px; }
  .auth-bg { min-height: 100vh; background: radial-gradient(1200px 600px at 10% -10%, rgba(124, 77, 255, .25), transparent 60%), radial-gradient(900px 500px at 110% 110%, rgba(91, 91, 240, .22), transparent 60%), var(--bg); padding: 1px 16px; }

  /* loans */
  .loan-picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .loan-picker select { min-width: 260px; max-width: 100%; font-weight: 600; }
  .loan-picker .count { color: var(--muted); font-size: .85rem; }
  .hero .phase { display: inline-block; margin-left: 8px; }
  .hero .hero-sub strong { font-weight: 700; }
  .meter-label { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--muted); margin: 16px 0 6px; flex-wrap: wrap; }
  .meter-label strong { color: var(--text); }
  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-box .axis { fill: var(--muted); font-size: 11px; }
  .chart-tip {
    position: absolute; top: 6px; pointer-events: none; display: none; z-index: 5;
    background: var(--card); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 8px 10px; font-size: .78rem; box-shadow: var(--shadow); white-space: nowrap; color: var(--muted);
  }
  .chart-tip .t-head { color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
  .chart-tip .t-row { display: flex; align-items: center; gap: 6px; }
  .chart-tip .t-val { color: var(--text); font-weight: 700; }
  .chart-tip .t-key { width: 12px; height: 2px; border-radius: 1px; flex: 0 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text-2); box-shadow: none; border-radius: 0; padding: 7px 14px; }
  .seg button:hover { box-shadow: none; background: var(--card-2); }
  .seg button.active { background: var(--accent-soft); color: var(--accent-ink); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-head .section-title { margin: 0; }
  .schedule-scroll { max-height: 540px; overflow: auto; }
  .mf-table td.mf-fund { min-width: 240px; max-width: 360px; }
  .mf-split { font-size: .76rem; color: var(--text-2); white-space: nowrap; }
  .seg button.active { background: var(--accent-soft); color: var(--accent-ink); }
  tr.now td { background: var(--accent-soft); font-weight: 600; }
  tr.past td { color: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .what-if-out { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .what-if-out .stat { margin: 0; }
  .loan-warn { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; color: var(--text-2); margin: 0 0 12px; }

  /* financial health */
  .health-hero { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .health-score { flex: 0 0 auto; }

<body>
<div id="app">Loading…</div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const money = (v) => {
  const n = Number(v);
  return (Number.isFinite(n) ? n : 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

async function api(path, opts) {
  const res = await fetch(path, { ...opts, credentials: "same-origin" });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/auth/login" && path !== "/api/auth/status") {
    main();  // the session is gone (e.g. the server restarted) — fall back to login
    throw new Error("Session expired — please log in again.");
  }
  if (!res.ok) throw new Error(body.error || `request failed (${res.status})`);
  return body;
}

async function main() {
  const status = await api("/api/auth/status");
  if (!status.password_set) {
    renderPasswordSetup();
    return;
  }
  if (!status.authenticated) {
    renderLogin();
    return;
  }
  const { families } = await api("/api/families");
  if (families.length === 0) {
    renderSetup();
    return;
  }
  await openFamily(families[0].family_id);
}

async function logout() {
  await api("/api/auth/logout", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
  });
  await main();
}

function renderPasswordSetup() {
  $("#app").innerHTML = `
    <div class="auth-bg"><div class="setup">
      <div class="brand-mark">${icon("logo", 24)}</div>
      <h1>Welcome</h1>
      <p class="subtitle">Set a password to protect this dashboard — you'll use it to log in each time. This runs once.</p>
      <form id="password-form">
        <label>Password
          <input name="password" type="password" required minlength="4" autofocus>
        </label>
        <button type="submit">Set password</button>
        <div class="error" id="password-error"></div>
      </form>
    </div></div>`;
  $("#password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api("/api/auth/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: f.get("password") }),
      });
      await main();
    } catch (err) {
      $("#password-error").textContent = err.message;
    }
  });
}

function renderLogin() {
  $("#app").innerHTML = `
    <div class="auth-bg"><div class="setup">
      <div class="brand-mark">${icon("logo", 24)}</div>
      <h1>Log in</h1>
      <form id="login-form">
        <label>Password
          <input name="password" type="password" required autofocus>
        </label>
        <button type="submit">Log in</button>
        <div class="error" id="login-error"></div>
      </form>
    </div></div>`;
  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: f.get("password") }),
      });
      await main();
    } catch (err) {
      $("#login-error").textContent = err.message;
    }
  });
}

function renderSetup() {
  $("#app").innerHTML = `
    <div class="auth-bg"><div class="setup">
      <div class="brand-mark">${icon("logo", 24)}</div>
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <h1>Set up your family</h1>
        <button class="secondary" type="button" onclick="logout()">Log out</button>
      </div>
      <p class="subtitle">This runs once — after this, everything you add here becomes part of your ongoing portfolio.</p>
      <form id="setup-form">
        <label>Family name
          <input name="family_name" required placeholder="e.g. Ray Family">
        </label>
        <label>Base currency
          <input name="base_currency" placeholder="INR" value="INR">
        </label>
        <button type="submit">Create family</button>
        <div class="error" id="setup-error"></div>
      </form>
    </div></div>`;
  $("#setup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const { family } = await api("/api/families", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          family_name: f.get("family_name"),
          base_currency: f.get("base_currency") || undefined,
        }),
      });
      await openFamily(family.family_id);
    } catch (err) {
      $("#setup-error").textContent = err.message;
    }
  });
}

// ----------------------------------------------------------------------
// Tabbed app: one tab per asset class, each opening on the whole family
// with a member filter. Every total shown comes from the Engine's portfolio
// endpoints — nothing here adds up money itself; charts only scale the
// Engine's figures into widths and angles.
//
// The route lives in the URL hash (#fd, #mf/member=3) so refresh and Back
// keep your place. A new asset class is one more entry in TABS plus its
// render function.
// ----------------------------------------------------------------------

const ICONS = {
  overview: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  health: '<path d="M20.8 8.6a5.3 5.3 0 0 0-9-3.8L12 5l-.8-.2a5.3 5.3 0 0 0-8 6.9L12 20l8.8-8.3a5.3 5.3 0 0 0 0-3.1z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/>',
  cashflow: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.5"/>',
  mf: '<path d="M12 3v9l7.8 4.5"/><circle cx="12" cy="12" r="9"/>',
  stock: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  fd: '<path d="M3 10h18L12 4z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',

  gold: '<path d="M4 14h7l-1.5-5h-4z"/><path d="M13 14h7l-1.5-5h-4z"/><path d="M8.5 20h7l-1.5-5h-4z"/>',
  nps: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  insurance: '<path d="M12 21c-5-2.5-8-6-8-11V5l8-3 8 3v5c0 5-3 8.5-8 11z"/>',
  loans: '<circle cx="12" cy="12" r="9"/><path d="M8.5 15.5l7-7"/><circle cx="9" cy="9" r="1.2"/><circle cx="15" cy="15" r="1.2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  logout: '<path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
  logo: '<path d="M4 18V9M10 18V5M16 18v-6"/><path d="M3 21h18"/>',
  settings: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  send: '<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
};
const icon = (name, size = 18) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

const TABS = [
  { id: "overview", label: "Overview", render: renderOverviewTab, filter: true, group: "Plan", blurb: "Your family's wealth at a glance" },
  { id: "health", label: "Financial Health", render: renderHealthTab, filter: true, group: "Plan", blurb: "A mirror of your money — and how to make it work harder" },
  { id: "cashflow", label: "Monthly Cash Flow", render: renderCashFlowTab, filter: true, group: "Plan", blurb: "Money in, money out, and what's left in the bank" },
  { id: "mf", label: "Mutual Funds", render: renderMfTab, filter: true, group: "Invest", blurb: "SIPs and lumpsums, synced daily from AMFI" },
  { id: "stock", label: "Stocks", render: renderStockTab, filter: true, group: "Invest", blurb: "Holdings, sectors and risk, synced daily from NSE/BSE" },
  { id: "fd", label: "Fixed Deposits", render: renderFdTab, filter: true, group: "Invest", blurb: "Deposits, interest and maturities" },
  { id: "pf", label: "PF", render: renderPfTab, filter: true, group: "Invest", blurb: "EPF and PPF from your passbook" },
  { id: "gold", label: "Gold", render: renderGoldTab, filter: true, group: "Invest", blurb: "Physical, digital and SGB" },
  { id: "nps", label: "NPS", render: renderNpsTab, filter: true, group: "Invest", blurb: "Tier I and Tier II accounts" },
  { id: "insurance", label: "Insurance", render: renderInsuranceTab, filter: true, group: "Protect", blurb: "Cover, premiums and surrender value" },
  { id: "loans", label: "Loans", render: renderLoansTab, filter: true, group: "Borrow", blurb: "Home, car and personal loans: EMIs, amortization and prepayments" },
  { id: "settings", label: "Reminders & Settings", render: renderSettingsTab, filter: false, group: "App", blurb: "Email reminders for FD maturities and premiums, and the assistant's API key" },
];
const CATEGORY_TAB = { MF: "mf", STOCK: "stock", FD: "fd", EPF: "pf", PPF: "pf", GOLD: "gold", NPS: "nps", INSURANCE: "insurance" };
const CATEGORY_LABEL = {
  MF: "Mutual Funds", FD: "Fixed Deposits", STOCK: "Stocks", GOLD: "Gold", EPF: "EPF",
  PPF: "PPF", NPS: "NPS", PROPERTY: "Property", INSURANCE: "Insurance (savings)",
};

let currentFamilyId = null;

function readRoute() {
  const [tab, member] = location.hash.replace(/^#/, "").split("/");
  const m = /^member=(\d+)$/.exec(member || "");
  return {
    tab: TABS.some((t) => t.id === tab) ? tab : "overview",
    memberId: m ? Number(m[1]) : null,
  };
}

function go(tab, memberId) {
  const hash = `#${tab}${memberId ? "/member=" + memberId : ""}`;
  if (location.hash === hash) renderApp().catch(showFatal);
  else location.hash = hash;  // the hashchange listener re-renders
}

// ---------------------------------------------------------------- theme
// The chosen theme is a per-browser convenience; without storage the page
// simply follows the computer's light/dark setting.
function storedTheme() {
  try { return localStorage.getItem("fcfo-theme"); } catch { return null; }
}
function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
function effectiveTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function toggleTheme() {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("fcfo-theme", next); } catch { /* per-browser only */ }
  renderApp().catch(showFatal);
}
applyTheme(storedTheme());

// Conversation state survives tab changes (the panel is rebuilt from it).
const chat = { open: false, busy: false, conversationId: null, log: [] };
const CHAT_SUGGESTIONS = [
  "What is our net worth and how is it split?",
  "Which FDs mature in the next 3 months?",
  "How much do we pay in insurance premiums a year?",
  "Which mutual funds are doing worst?",
  "How much interest is left on the home loan?",

];

// A small, safe Markdown subset for answers: paragraphs, **bold**, bullet
// lists and pipe tables. Everything is escaped first.
function renderMarkdown(text) {
  const inline = (t) => escapeHtml(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = [];
  const lines = String(text).split("\n");
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, n) => `<tr>${cells(r).map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^\s*([-*•]|\d+\.)\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+\.)\s+/, ""));
      out.push(`<ul>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</ul>`);
    } else if (line.trim() === "") {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^\s*(\||[-*•]\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++].replace(/^#+\s*/, ""));
      out.push(`<p>${para.map(inline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

const TOOL_LABELS = {
  get_net_worth: "net worth", get_mutual_funds: "mutual funds", get_stocks: "stocks", get_fixed_deposits: "FDs",
  get_insurance: "insurance", get_loans: "loans", get_provident_funds: "PF", get_nps: "NPS", get_gold: "gold",
  get_cash_flow: "cash flow", get_financial_health: "financial health", get_upcoming_dues: "due dates",
};

function mountChat(familyId, members) {
  const root = $("#chat-root");
  if (!root) return;
  if (!chat.open) {
    root.innerHTML = `<button type="button" class="chat-fab" id="chat-open">${icon("chat", 20)}<span>Ask Family CFO</span></button>`;
    $("#chat-open").addEventListener("click", () => { chat.open = true; mountChat(familyId, members); $("#chat-input")?.focus(); });
    return;
  }
  const msgs = chat.log.map((m) => m.role === "user"
    ? `<div class="chat-msg user">${escapeHtml(m.text)}</div>`
    : m.role === "error"
      ? `<div class="chat-msg err">${escapeHtml(m.text)}${m.settings
          ? `<p style="margin-top:8px"><a href="#settings" id="chat-to-settings">Open Reminders &amp; Settings →</a></p>` : ""}</div>`
      : `<div class="chat-msg bot">${renderMarkdown(m.text)}${m.used && m.used.length
          ? `<div class="used">Looked at: ${[...new Set(m.used)].map((t) => TOOL_LABELS[t] || t).join(", ")}</div>` : ""}</div>`).join("");
  root.innerHTML = `
    <div class="chat-panel" role="dialog" aria-label="Ask Family CFO">
      <div class="chat-head">${icon("chat", 20)}
        <div class="t">Ask Family CFO<small>Answers from your own figures</small></div>
        <button type="button" id="chat-new" title="Start a new conversation">New</button>
        <button type="button" id="chat-close" title="Close">${icon("close", 16)}</button>
      </div>
      <div class="chat-log" id="chat-log">
        ${chat.log.length ? "" : `<div class="chat-msg bot"><p>Ask me anything about your family's money — balances, maturities, premiums, loans, returns, or what to improve.</p></div>
          <div class="chat-suggest">${CHAT_SUGGESTIONS.map((q) => `<button type="button" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("")}</div>`}
        ${msgs}
        ${chat.busy ? `<div class="chat-msg bot"><span class="typing"><i></i><i></i><i></i></span></div>` : ""}
      </div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" placeholder="Type a question…" ${chat.busy ? "disabled" : ""}></textarea>
        <button type="submit" ${chat.busy ? "disabled" : ""} title="Send">${icon("send", 16)}</button>
      </form>
      <div class="chat-note">Answered by the AI chosen in Settings (Groq or Claude). The figures needed are sent; PAN and account numbers never are. A guide, not personal financial advice.</div>
    </div>`;
  const log = $("#chat-log");
  log.scrollTop = log.scrollHeight;
  const send = async (question) => {
    question = question.trim();
    if (!question || chat.busy) return;
    chat.log.push({ role: "user", text: question });
    chat.busy = true;
    mountChat(familyId, members);
    try {
      const r = await api(`/api/families/${familyId}/ask`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: chat.conversationId }),
      });
      chat.conversationId = r.conversation_id;
      chat.log.push({ role: "bot", text: r.answer, used: r.tools_used });
    } catch (err) {
      chat.log.push({ role: "error", text: err.message, settings: /API key|Settings/.test(err.message) });
    } finally {
      chat.busy = false;
      if ($("#chat-root")) mountChat(familyId, members);
      $("#chat-input")?.focus();
    }
  };
  $("#chat-close").addEventListener("click", () => { chat.open = false; mountChat(familyId, members); });
  $("#chat-new").addEventListener("click", () => { chat.log = []; chat.conversationId = null; mountChat(familyId, members); });
  root.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => send(b.dataset.q)));
  const input = $("#chat-input");
  $("#chat-form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
}

const pct = (v) => (v == null ? "—" : (Number(v) * 100).toFixed(2) + "%");
const memberQuery = (selected) => (selected ? `?member_id=${selected.member_id}` : "");
const scopeName = (selected) => (selected ? escapeHtml(selected.name) : "Whole family");

// "+₹1,234.00" / "-₹1,234.00" — the sign before the rupee symbol.
function signedInr(value) {
  const n = Math.abs(Number(value)) < 0.005 ? 0 : Number(value);  // no "-₹0.00" from a fraction of a paisa
  return `${n > 0 ? "+" : n < 0 ? "-" : ""}₹${money(Math.abs(n))}`;
}

// Big-number display only: ₹12.45 L / ₹1.20 Cr (Indian lakh / crore).
function inrShort(value) {
  const n = Number(value) || 0;
  const a = Math.abs(n), sign = n < 0 ? "-" : "";
  if (a >= 1e7) return `${sign}₹${(a / 1e7).toFixed(2)} Cr`;
  if (a >= 1e5) return `${sign}₹${(a / 1e5).toFixed(2)} L`;
  return `${sign}₹${a.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
}
const signedShort = (v) => (Number(v) > 0 ? "+" : "") + inrShort(v);

function stat(label, value, signed = false) {
  const n = Number(value);
  const cls = signed ? (n >= 0 ? "gain" : "loss") : "";
  const full = signed ? signedInr(value) : "₹" + money(value);
  const short = signed ? signedShort(value) : inrShort(value);
  return `<div class="stat"><div class="label">${label}</div>
    <div class="value ${cls}" title="${full}">${short}</div>
    ${short !== full ? `<div class="sub">${full}</div>` : ""}</div>`;
}

function textStat(label, text) {
  return `<div class="stat"><div class="label">${label}</div><div class="value small">${text}</div></div>`;
}

function gainCell(amount, pctValue) {
  const cls = Number(amount) > -0.005 ? "gain" : "loss";
  const pctShown = Math.abs(Number(pctValue)) < 0.005 ? 0 : Number(pctValue);
  const sign = pctShown >= 0 ? "+" : "";
  return `<td class="${cls}">${signedInr(amount)}<div class="empty">${sign}${money(pctShown)}%</div></td>`;
}

function ownerSelect(members, selected) {
  return `<label>Owner<select name="owner_id">${members.map((m) =>
    `<option value="${m.member_id}" ${selected && m.member_id === selected.member_id ? "selected" : ""}>${escapeHtml(m.name)}</option>`
  ).join("")}</select></label>`;
}

const NO_MEMBERS_NOTE = `<p class="empty">Add a family member on the Overview tab first.</p>`;

function postJson(path, payload) {
  return api(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
}

// Submit handler for every add/update form: collects fields, lets `send`
// post them, re-renders on success, shows the error under the form otherwise.
function wireForm(formSel, errorSel, send) {
  const form = $(formSel);
  if (!form) return;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fields = Object.fromEntries(new FormData(form).entries());
    try {
      await send(fields);
      await renderApp();
    } catch (err) {
      $(errorSel).textContent = err.message;
    }
  });
}

const dropEmpty = (obj, ...keys) => { keys.forEach((k) => { if (!obj[k]) delete obj[k]; }); return obj; };

// ---------------------------------------------------------------- charts
// Pure presentation: every figure comes from the Engine; these only turn
// percentages and amounts into lengths, angles and colours.

const PALETTE = ["#5b5bf0", "#0fb5ae", "#f59e0b", "#ec4899", "#8b5cf6", "#10b981", "#f97316", "#3b82f6", "#ef4444", "#14b8a6", "#a855f7", "#84cc16"];
const paletteAt = (i) => PALETTE[i % PALETTE.length];

// A donut: SVG circle strokes with pathLength 100, so each slice's length is
// its percentage. `slices`: [{label, pct, valueText, color}].
function donut(slices, { size = 170, centerTop = "", centerBottom = "", legend = true } = {}) {
  const shown = slices.filter((s) => Number(s.pct) > 0);
  let offset = 25;
  const gap = shown.length > 1 ? 0.8 : 0;
  const arcs = shown.map((s) => {
    const p = Number(s.pct);
    const len = Math.max(p - gap, 0.2);
    const arc = `<circle r="38" cx="50" cy="50" fill="none" stroke="${s.color}" stroke-width="13"
      pathLength="100" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${offset}" stroke-linecap="butt"><title>${escapeHtml(s.label)}: ${money(s.pct)}%</title></circle>`;
    offset -= p;
    return arc;
  }).join("");
  const svg = `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img">
      <circle r="38" cx="50" cy="50" fill="none" stroke="var(--bg-2)" stroke-width="13"></circle>
      ${arcs}
      <text x="50" y="${centerBottom ? 48 : 53}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--text)">${centerTop}</text>
      ${centerBottom ? `<text x="50" y="61" text-anchor="middle" font-size="6.2" fill="var(--muted)">${centerBottom}</text>` : ""}
    </svg>`;
  if (!legend) return svg;
  const items = shown.map((s) => `<li><span class="swatch" style="background:${s.color}"></span>
      <span class="lg-name">${s.labelHtml || escapeHtml(s.label)}</span><span class="lg-val">${s.valueText || ""}</span>
      <span class="lg-pct">${money(s.pct)}%</span></li>`).join("");
  return shown.length
    ? `<div class="donut-wrap">${svg}<ul class="legend">${items}</ul></div>`
    : `<p class="empty">Nothing yet</p>`;
}

// Horizontal bars: [{label, pct (0-100 bar length), right, color}].
function barList(items) {
  if (!items.length) return `<p class="empty">Nothing yet</p>`;
  return items.map((it) => `
    <div class="bar-row">
      <span class="bar-label" title="${escapeHtml(it.label)}">${it.labelHtml || escapeHtml(it.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(Math.min(Number(it.pct), 100), 0)}%;${it.color ? `background:${it.color}` : ""}"></span></span>
      <span class="bar-value">${it.right ?? ""}</span>
    </div>`).join("");
}

// Two bars per row on one shared scale, e.g. invested vs current value.
function dualBars(items, aName, bName) {
  if (!items.length) return `<p class="empty">Nothing yet</p>`;
  const max = Math.max(...items.flatMap((it) => [Number(it.a) || 0, Number(it.b) || 0]), 1);
  const rows = items.map((it) => {
    const down = Number(it.b) < Number(it.a);
    return `<div class="bar-row">
      <span class="bar-label" title="${escapeHtml(it.label)}">${it.labelHtml || escapeHtml(it.label)}</span>
      <span class="dual">
        <span class="bar-track"><span class="bar-fill" style="width:${(Number(it.a) / max) * 100}%"></span></span>
        <span class="bar-track"><span class="bar-fill b ${down ? "down" : ""}" style="width:${(Number(it.b) / max) * 100}%"></span></span>
      </span>
      <span class="bar-value">${inrShort(it.b)}<div class="empty">${inrShort(it.a)}</div></span>
    </div>`;
  }).join("");
  return `<div class="key"><span><span class="swatch" style="background:var(--accent)"></span>${aName}</span>
      <span><span class="swatch" style="background:var(--gain)"></span>${bName}</span></div>${rows}`;
}

// One bar split into coloured parts: [{label, pct, color, valueText}].
function stackBar(parts) {
  const shown = parts.filter((p) => Number(p.pct) > 0);
  return `<div class="stack">${shown.map((p) => `<span style="width:${Number(p.pct)}%;background:${p.color}" title="${escapeHtml(p.label)} ${money(p.pct)}%"></span>`).join("")}</div>
    <div class="key" style="margin:10px 0 0">${shown.map((p) => `<span><span class="swatch" style="background:${p.color}"></span>${escapeHtml(p.label)} <strong style="color:var(--text)">${money(p.pct)}%</strong>${p.valueText ? ` · ${p.valueText}` : ""}</span>`).join("")}</div>`;
}

// A half-circle meter with `steps` coloured zones and a needle on `index`.
function gauge(index, labels, colors, caption = "") {
  const n = labels.length;
  const seg = 180 / n;
  const polar = (deg, r) => [50 + r * Math.cos((Math.PI * (180 - deg)) / 180), 52 - r * Math.sin((Math.PI * (180 - deg)) / 180)];
  const arcs = labels.map((_, i) => {
    const [x1, y1] = polar(i * seg + 1.5, 40), [x2, y2] = polar((i + 1) * seg - 1.5, 40);
    return `<path d="M${x1} ${y1} A40 40 0 0 1 ${x2} ${y2}" stroke="${colors[i]}" stroke-width="11" fill="none" stroke-linecap="round" opacity="${i === index ? 1 : .35}"/>`;
  }).join("");
  const [nx, ny] = polar(index * seg + seg / 2, 30);
  return `<svg viewBox="0 0 100 68" width="190" height="129" role="img">
      ${arcs}
      <line x1="50" y1="52" x2="${nx}" y2="${ny}" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="50" cy="52" r="4" fill="var(--text)"/>
      <text x="50" y="65" text-anchor="middle" font-size="7" font-weight="700" fill="var(--text)">${escapeHtml(labels[index])}</text>
    </svg>${caption ? `<div class="empty" style="text-align:center">${caption}</div>` : ""}`;
}

// Income -> expenses -> investments -> surplus as a waterfall.
function waterfall(steps) {
  const W = 520, H = 190, pad = 26, barW = 70;
  const max = Math.max(...steps.flatMap((s) => [Math.abs(Number(s.to)), Math.abs(Number(s.from || 0))]), 1);
  const y = (v) => H - pad - (Math.max(Number(v), 0) / max) * (H - pad * 2);
  const gapX = (W - pad * 2 - barW * steps.length) / Math.max(steps.length - 1, 1);
  const bars = steps.map((s, i) => {
    const x = pad + i * (barW + gapX);
    const top = Math.min(y(s.from || 0), y(s.to)), bottom = Math.max(y(s.from || 0), y(s.to));
    const h = Math.max(bottom - top, 2);
    return `<rect x="${x}" y="${top}" width="${barW}" height="${h}" rx="8" fill="${s.color}"><title>${escapeHtml(s.label)}</title></rect>
      <text x="${x + barW / 2}" y="${top - 7}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${s.valueText}</text>
      <text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${escapeHtml(s.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">
      <line x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="var(--border)"/>${bars}</svg>`;
}

// Weighted blocks (a simple treemap): [{label, sub, weight, color}].
function blocks(items) {
  if (!items.length) return `<p class="empty">Nothing yet</p>`;
  return `<div class="blocks">${items.map((it) => `
    <div class="block" style="flex:${Math.max(Number(it.weight), 1)} 1 ${Math.max(Number(it.weight) - 2, 8)}%;background:${it.color}" title="${escapeHtml(it.title || it.label)}">
      <span class="b-sym">${escapeHtml(it.label)}</span><span class="b-sub">${it.sub}</span></div>`).join("")}</div>`;
}

function wireMemberEditor(members, body) {
  const memberEdit = $("#member-edit-details"), mForm = $("#member-edit-form");
  const syncStage = () => { mForm.querySelector("[data-earning-only]").style.display = mForm.life_stage.value === "EARNING" ? "" : "none"; };
  mForm.life_stage.addEventListener("change", syncStage);
  body.querySelectorAll("[data-member-edit]").forEach((b) => b.addEventListener("click", (e) => {
    e.preventDefault();
    const m = members.find((x) => String(x.member_id) === b.dataset.memberEdit);
    mForm.member_id.value = m.member_id;
    mForm.name.value = m.name;
    mForm.relationship.value = m.relationship;
    mForm.date_of_birth.value = m.date_of_birth ?? "";
    mForm.life_stage.value = m.life_stage ?? "";
    mForm.heir_member_id.value = m.heir_member_id ?? "";
    [...mForm.heir_member_id.options].forEach((o) => { o.disabled = o.value === String(m.member_id); });
    mForm.retirement_age.value = m.retirement_age ?? "";
    syncStage();
    $("#member-edit-error").textContent = "";
    memberEdit.style.display = "";
    memberEdit.open = true;
    memberEdit.querySelector("summary").textContent = `Edit ${m.name}`;
    memberEdit.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
  $("#member-edit-cancel").addEventListener("click", () => { memberEdit.style.display = "none"; });
  wireForm("#member-edit-form", "#member-edit-error", ({ member_id, ...f }) =>
    postJson(`/api/members/${member_id}/profile`, dropEmpty(f, "date_of_birth", "life_stage", "heir_member_id", "retirement_age")));
}

const shortName = (s, n = 26) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function vizCashFlow(cf) {
  const income = Number(cf.total_income), exp = Number(cf.total_expenses), inv = Number(cf.total_investments);
  const wf = waterfall([
    { label: "Income", from: 0, to: income, color: "var(--gain)", valueText: inrShort(cf.total_income) },
    { label: "Expenses", from: income, to: income - exp, color: "var(--loss)", valueText: "-" + inrShort(cf.total_expenses) },
    { label: "Investments", from: income - exp, to: income - exp - inv, color: "var(--accent)", valueText: "-" + inrShort(cf.total_investments) },
    { label: "Left over", from: 0, to: Number(cf.surplus), color: Number(cf.surplus) >= 0 ? "#0fb5ae" : "var(--loss)", valueText: signedShort(cf.surplus) },
  ]);
  const counted = cf.expenses.filter((l) => l.counted);
  const expDonut = donut(counted.map((l, i) => ({
    label: l.label, color: paletteAt(i + 2), valueText: inrShort(l.monthly_amount),
    pct: exp ? (Number(l.monthly_amount) / exp) * 100 : 0,
  })), { centerTop: inrShort(cf.total_expenses), centerBottom: "per month", size: 150 });
  const maxBal = Math.max(...cf.accounts.map((a) => Math.abs(Number(a.estimated_balance))), 1);
  const banks = barList(cf.accounts.map((a, i) => ({
    label: `${a.owner_name} · ${a.bank_name}`, pct: (Math.abs(Number(a.estimated_balance)) / maxBal) * 100,
    color: paletteAt(i), right: inrShort(a.estimated_balance),
  })));
  return `<div class="grid-2 viz-row">
      <div class="card"><h3 class="section-title">Where this month's money goes</h3>${wf}</div>
      <div class="card"><h3 class="section-title">Expenses by item</h3>${expDonut}
        <h3 class="section-title" style="margin-top:18px">Cash in bank (estimated)</h3>${banks}</div>
    </div>`;
}

function vizMf(p) {

  const top = [...active].sort((a, b) => Number(b.mf.current_value) - Number(a.mf.current_value)).slice(0, 8);
  const bars = dualBars(top.map((r) => ({

    { label: "Lumpsum", pct: (Number(p.total_lumpsum_invested) / invested) * 100, color: "#f59e0b", valueText: inrShort(p.total_lumpsum_invested) },

  return `<div class="grid-2 viz-row">

function vizStockMap(p) {
  const held = p.groups.filter((g) => Number(g.quantity) > 0);
  return `<div class="card viz-row"><h3 class="section-title">Holdings map <span class="empty" style="text-transform:none;letter-spacing:0">size = share of portfolio · colour = gain / loss</span></h3>

function vizInsurance(p) {
  const active = p.rows.filter((r) => r.policy.status === "ACTIVE");
  const year = new Date().getFullYear(), thisMonth = new Date().getMonth();
  // Which months of this year each premium falls in (from its start date and frequency).
  const step = { MONTHLY: 1, QUARTERLY: 3, ANNUAL: 12 };
  const dues = Array.from({ length: 12 }, () => []);
  active.forEach((r) => {
    const start = new Date(r.policy.start_date), s = step[r.policy.premium_frequency];
    const end = r.policy.maturity_date ? new Date(r.policy.maturity_date) : null;
    for (let m = 0; m < 12; m++) {
      const due = new Date(year, m, Math.min(start.getDate(), 28));
      const monthsFromStart = (year - start.getFullYear()) * 12 + (m - start.getMonth());
      if (monthsFromStart >= 0 && monthsFromStart % s === 0 && (!end || due < end)) dues[m].push(r);
    }
  });
  const cal = `<div class="months">${dues.map((list, m) => `
      <div class="month ${list.length ? "due" : ""} ${m === thisMonth ? "now" : ""}" title="${escapeHtml(list.map((r) => `${r.policy.insurer} ${r.policy.policy_number}`).join(", "))}">
        <div class="m-name">${MONTH_NAMES[m]}</div>
        ${list.length ? `<div class="m-amt">${inrShort(list.reduce((t, r) => t + Number(r.policy.premium_amount), 0))}</div>
          <div>${list.length} due</div>` : `<div style="margin-top:6px">—</div>`}
      </div>`).join("")}</div>`;
  const cover = Number(p.total_sum_assured) || 1;
  const d = donut(active.filter((r) => r.policy.sum_assured).map((r, i) => ({
    label: `${r.policy.insurer} · ${r.policy.policy_type.toLowerCase()} · ${r.owner_name}`, color: paletteAt(i),
    pct: (Number(r.policy.sum_assured) / cover) * 100, valueText: inrShort(r.policy.sum_assured),
  })), { centerTop: inrShort(p.total_sum_assured), centerBottom: "total cover", size: 150 });
  const maxPremium = Math.max(...active.map((r) => Number(r.policy.premium_amount)), 1);
  const premiums = barList(active.map((r, i) => ({
    label: `${r.policy.insurer} ${r.policy.policy_number} · ${r.owner_name}`, color: paletteAt(i),
    pct: (Number(r.policy.premium_amount) / maxPremium) * 100,
    right: `${inrShort(r.policy.premium_amount)} <span class="empty">/ ${r.policy.premium_frequency.toLowerCase().replace("annual", "year").replace("quarterly", "quarter").replace("monthly", "month")}</span>`,
  })));
  return `<div class="card viz-row"><h3 class="section-title">Premium calendar ${year}</h3>${cal}
        <p class="empty" style="margin-bottom:0">Months highlighted have a premium due; hover to see which. This month is outlined.</p></div>
    <div class="grid-2 viz-row">
      <div class="card"><h3 class="section-title">Who is covered for how much</h3>${d}</div>
      <div class="card"><h3 class="section-title">Premium per policy</h3>${premiums}</div>
    </div>`;
}

// ---------------------------------------------------------------- dates
function fmtDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  return m ? `${Number(m[3])} ${MONTH_NAMES[Number(m[2]) - 1]} ${m[1]}` : escapeHtml(iso ?? "");
}
// Shows every ISO date in rendered text as "1 Jan 2025" (inputs untouched).
function prettifyDates(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const iso = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  const nodes = [];
  while (walker.nextNode()) if (/\d{4}-\d{2}-\d{2}/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    if (n.parentElement && ["SCRIPT", "STYLE", "OPTION", "TEXTAREA"].includes(n.parentElement.tagName)) return;
    n.nodeValue = n.nodeValue.replace(iso, (_, y, mo, d) => `${Number(d)} ${MONTH_NAMES[Number(mo) - 1]} ${y}`);
  });
}

    const fillCategories = (keep) => {
      form.category.innerHTML = CATEGORIES[form.flow_type.value]
        .map((c) => `<option ${c === keep ? "selected" : ""}>${c}</option>`).join("");
    };
    const fillAccounts = (keep) => {
      const own = allAccounts.filter((a) => String(a.member_id) === form.owner_id.value);
      form.account_id.innerHTML = `<option value="">Default account</option>` +
        own.map((a) => `<option value="${a.account_id}" ${String(a.account_id) === String(keep) ? "selected" : ""}>${escapeHtml(accountLabel(a))}</option>`).join("");
      form.account_id.disabled = form.payment_mode.value === "CASH";
    };
    form.flow_type.addEventListener("change", () => fillCategories());
    form.owner_id.addEventListener("change", () => fillAccounts());
    form.payment_mode.addEventListener("change", () => fillAccounts(form.account_id.value));
    fillCategories();
    fillAccounts();

    const syncOnce = () => {
      const once = form.frequency.value === "ONCE";
      $("#cf-spent-on").style.display = once ? "" : "none";
      form.spent_on.required = once;
      if (once && !form.spent_on.value) {
        // default: today if this month is shown, else the 1st of the month shown
        form.spent_on.value = todayIso().slice(0, 7) === cashFlowMonth ? todayIso() : `${cashFlowMonth}-01`;
      }
    };
    form.frequency.addEventListener("change", syncOnce);
    wireForm("#cf-form", "#cf-error", ({ item_id, owner_id, ...f }) => {
      if (f.frequency !== "ONCE") delete f.spent_on;
      const payload = dropEmpty(f, "account_id", "name", "spent_on");
      return item_id
        ? postJson(`/api/cashflow-items/${item_id}/update`, { owner_id, ...payload })
        : postJson(`/api/members/${owner_id}/cashflow-items`, payload);
    });

    const all = [...cf.income, ...cf.expenses, ...cf.investments];
    body.querySelectorAll("[data-edit-item]").forEach((b) => b.addEventListener("click", () => {
      const l = all.find((x) => String(x.item_id) === b.dataset.editItem);
      form.item_id.value = l.item_id;
      form.owner_id.value = l.member_id;
      form.flow_type.value = l.flow_type;
      fillCategories(l.category);
      form.elements.namedItem("name").value = l.label === l.category ? "" : l.label;
      form.amount.value = l.amount;
      form.frequency.value = l.frequency;
      form.spent_on.value = l.spent_on || "";
      syncOnce();
      form.payment_mode.value = l.payment_mode || "UPI";
      fillAccounts(l.account_id);
      $("#cf-form-title").textContent = `Edit — ${l.label}`;
      $("#cf-submit").textContent = "Save changes";
      $("#cf-cancel").style.display = "";
      $("#cf-form-details").open = true;
      $("#cf-form-details").scrollIntoView({ behavior: "smooth", block: "center" });
    }));
    $("#cf-cancel").addEventListener("click", () => renderApp().catch(showFatal));

    body.querySelectorAll("[data-delete-item]").forEach((b) => b.addEventListener("click", async () => {
      const l = all.find((x) => String(x.item_id) === b.dataset.deleteItem);
      if (!confirm(`Delete "${l.label}" (${l.owner_name})?`)) return;
      try {
        await postJson(`/api/cashflow-items/${l.item_id}/delete`, {});
        await renderApp();
      } catch (err) { $("#cf-action-error").textContent = err.message; }
    }));
  }

  body.querySelectorAll("[data-premium]").forEach((box) => box.addEventListener("change", async () => {
    try {
      await postJson(`/api/insurance/${box.dataset.premium}/premium-paid`,
        { due_date: box.dataset.due, paid: box.checked });
      await renderApp();
    } catch (err) {
      box.checked = !box.checked;
      $("#cf-action-error").textContent = err.message;
    }
  }));
}

          <label>Amount invested now<input name="invested" type="number" step="0.01" required></label>
          <label>As of<input name="as_of" type="date" required></label>
          <button type="submit">Update figures</button>

        <div class="error" id="mf-figures-error"></div>

        <div class="error" id="mf-txn-edit-error"></div>

      <details id="mf-complete-details" style="display:none">
        <summary>Complete purchase details</summary>
        <p class="empty" style="margin-top:0">This fund came from a CAS, which only has this month's transactions, so everything bought before is one undated opening balance (<span id="mf-complete-opening"></span>). Tell the app how it was invested and XIRR is worked out from then on.</p>
        <form class="inline" id="mf-complete-form">
          <input type="hidden" name="asset_id">
          <label>Invested by<select name="invested_by">
            <option value="SIP_RUNNING">SIP · still running</option>
            <option value="SIP_STOPPED">SIP · stopped (units still held)</option>
            <option value="LUMPSUM">Lumpsum</option>

          <button type="submit">Save</button>
          <button type="button" class="secondary" id="mf-complete-cancel">Cancel</button>

  const kindCount = (k) => (p.by_kind.find((x) => x.kind === k) || { funds: 0 }).funds;
  const views = [["OVERVIEW", "Overview"], ["ALL", `All funds (${p.rows.length})`],
    ["SIP_RUNNING", `Running SIPs (${kindCount("SIP_RUNNING")})`], ["SIP_STOPPED", `Stopped SIPs (${kindCount("SIP_STOPPED")})`],
    ["LUMPSUM", `Lumpsum (${kindCount("LUMPSUM")})`], ["UNSET", `Needs details (${kindCount("UNSET")})`]]

    `<div class="subnav" id="mf-views">${views.map(([k, t]) =>
      `<button type="button" data-view="${k}" class="${k === mfView ? "active" : ""}">${t}</button>`).join("")}</div>
     <div id="mf-overview">${vizMf(p)}</div>`);

  $("#mf-cas-btn")?.addEventListener("click", () => {
    const box = $("#mf-cas-box");
    const opening = box.style.display === "none";

    if (opening) {
      box.querySelector("details").open = true;
      box.scrollIntoView({ behavior: "smooth", block: "start" });

  // One form open at a time, from the Manage buttons.
  const panels = body.querySelectorAll("#mf-manage [data-panel]");
  body.querySelectorAll("[data-manage]").forEach((b) => b.addEventListener("click", () => {

      b.classList.add("active");
      const panel = body.querySelector(`#mf-manage [data-panel="${b.dataset.manage}"]`);
      panel.style.display = "";
      const det = panel.querySelector("details");
      if (det) det.open = true;
    }
  }));
  wireCasImport(members);

  $("#mf-sync-btn").addEventListener("click", async (e) => {
    const out = $("#mf-sync-result");
    e.target.disabled = true;
    out.textContent = "Syncing from AMFI…";
    try {
      const { sync: r } = await postJson(`/api/families/${familyId}/mfs/sync`, {});
      if (r.error) {
        out.innerHTML = `<span class="loss">${escapeHtml(r.error)}</span>`;
        e.target.disabled = false;
        return;
      }
      await renderApp();
      const unmatched = r.unmatched.length
        ? ` · not synced: ${r.unmatched.map(escapeHtml).join("; ")}` : "";
      $("#mf-sync-result").innerHTML =
        `Updated ${r.updated.length}, already current ${r.unchanged.length}${unmatched}`;
    } catch (err) {
      out.innerHTML = `<span class="loss">${escapeHtml(err.message)}</span>`;
      e.target.disabled = false;
    }
  });

  wireForm("#mf-add-form", "#mf-add-error", ({ owner_id, ...f }) =>
    postJson(`/api/members/${owner_id}/mfs`, dropEmpty(f, "isin", "sip_amount", "sip_date")));
  wireForm("#mf-sip-form", "#mf-sip-error", ({ asset_id, ...f }) =>
    postJson(`/api/mfs/${asset_id}/sip`, dropEmpty(f, "sip_amount", "sip_date")));
  const sipForm = $("#mf-sip-form");
  if (sipForm) {
    const fill = () => {
      const mf = p.rows.find((r) => String(r.mf.asset_id) === sipForm.asset_id.value).mf;
      sipForm.sip_amount.value = mf.sip_enabled ? (mf.sip_amount ?? "") : "";
    };
    sipForm.asset_id.addEventListener("change", fill);
    fill();
  }
  wireForm("#mf-txn-form", "#mf-txn-error", ({ asset_id, ...f }) =>
    postJson(`/api/mfs/${asset_id}/transactions`, f));
  wireForm("#mf-val-form", "#mf-val-error", ({ asset_id, ...f }) =>
    postJson(`/api/mfs/${asset_id}/valuations`, f));

  const completeDetails = $("#mf-complete-details");
  const completeForm = $("#mf-complete-form");
  const syncCompleteFields = () => {
    const how = completeForm.invested_by.value;
    const both = how.startsWith("BOTH");
    const running = how === "SIP_RUNNING" || how === "BOTH_RUNNING";
    const sip = how !== "LUMPSUM";
    completeDetails.querySelectorAll("[data-for]").forEach((el) => {
      const f = el.dataset.for;
      const show = f === how || (f === "SIP" && sip) || (f === "RUNNING" && running) || (f === "BOTH" && both);
      el.style.display = show ? "" : "none";
    });
  };
  completeForm.invested_by.addEventListener("change", syncCompleteFields);
  body.querySelectorAll("[data-complete]").forEach((b) => b.addEventListener("click", () => {
    const mf = p.rows.find((r) => String(r.mf.asset_id) === b.dataset.complete).mf;
    completeForm.reset();
    completeForm.asset_id.value = mf.asset_id;
    completeForm.invested_by.value = mf.sip_status === "RUNNING" ? "SIP_RUNNING" : "LUMPSUM";
    completeForm.amount.placeholder = mf.opening_amount ?? "";
    completeForm.sip_amount.value = mf.sip_amount ?? "";
    completeForm.sip_date.value = mf.sip_date ?? "";
    completeForm.broker.value = mf.broker ?? "";
    completeForm.dataset.broker = mf.broker ?? "";
    $("#mf-complete-opening").textContent = `₹${money(mf.opening_amount)} of ${mf.scheme_name}`;
    $("#mf-complete-error").textContent = "";
    syncCompleteFields();
    completeDetails.style.display = "";
    completeDetails.open = true;
    completeDetails.querySelector("summary").textContent = `Complete purchase details — ${mf.scheme_name}`;
    completeDetails.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
  $("#mf-complete-cancel").addEventListener("click", () => { completeDetails.style.display = "none"; });
  wireForm("#mf-complete-form", "#mf-complete-error", ({ asset_id, ...f }) => {
    const how = f.invested_by;
    const running = how === "SIP_RUNNING" || how === "BOTH_RUNNING";
    const payload = how === "LUMPSUM"
      ? { invested_by: how, purchase_date: f.purchase_date, amount: f.amount }
      : { invested_by: running ? "SIP_RUNNING" : "SIP_STOPPED", current_xirr_pct: f.current_xirr_pct,
          ...(running ? { sip_amount: f.sip_amount, sip_date: f.sip_date } : {}),
          ...(how.startsWith("BOTH") ? { lumpsum_amount: f.lumpsum_amount, lumpsum_date: f.lumpsum_date, lumpsum_units: f.lumpsum_units } : {}) };
    const broker = (f.broker || "").trim();
    return postJson(`/api/mfs/${asset_id}/purchase-details`,
      dropEmpty(payload, "amount", "sip_amount", "sip_date", "lumpsum_units", "current_xirr_pct"))
      .then((r) => broker && broker !== completeForm.dataset.broker
        ? postJson(`/api/mfs/${asset_id}/broker`, { broker }).then(() => r) : r);
  });

  // Sub-pages and the broker filter only show or hide; totals come from the Engine.
  const brokerFilter = $("#mf-broker-filter");
  const holdingsCard = $("#mf-kind-filter").closest(".card");
  const applyKindFilter = () => {
    const broker = brokerFilter.value;
    $("#mf-overview").style.display = mfView === "OVERVIEW" ? "" : "none";
    holdingsCard.style.display = mfView === "OVERVIEW" ? "none" : "";
    body.querySelectorAll("tr[data-kind]").forEach((tr) => {
      const kindOk = mfView === "ALL" || tr.dataset.kind.split(" ").includes(mfView);
      const brokerOk = broker === "*" || tr.dataset.broker === broker;
      tr.style.display = kindOk && brokerOk ? "" : "none";
    });
    $("#mf-holdings-count").textContent = [...body.querySelectorAll("tr[data-kind]")].filter((tr) => tr.style.display !== "none").length;
    const k = p.by_kind.find((x) => x.kind === mfView);
    $("#mf-view-summary").innerHTML = k ? `<div class="view-summary">
        <span><strong>${k.funds}</strong> fund${k.funds === 1 ? "" : "s"}</span>
        <span>Invested <strong>${inrShort(k.invested)}</strong></span>
        <span>Now <strong>${inrShort(k.current_value)}</strong></span>
        <span class="${Number(k.gain_loss) > -0.005 ? "gain" : "loss"}">${signedShort(k.gain_loss)} (${money(k.gain_loss_pct)}%)</span>
        ${Number(k.monthly_sip) > 0 ? `<span>SIP <strong>${inrShort(k.monthly_sip)}</strong> / month</span>` : ""}
        ${mfView === "UNSET" ? `<span class="empty">Click "Details needed" on a fund to date its purchases and switch on XIRR.</span>` : ""}
        ${mfView === "SIP_STOPPED" ? `<span class="empty">Units are still invested and growing; only the monthly instalments have stopped.</span>` : ""}
      </div>` : "";
  };
  body.querySelectorAll("#mf-views [data-view]").forEach((b) => b.addEventListener("click", () => {
    mfView = b.dataset.view;
    body.querySelectorAll("#mf-views [data-view]").forEach((x) => x.classList.toggle("active", x === b));
    applyKindFilter();
  }));
  brokerFilter.addEventListener("change", applyKindFilter);
  applyKindFilter();
  wireMfEditor(p, body);

  body.querySelectorAll("[data-broker-for]").forEach((sel) => sel.addEventListener("change", async () => {
    let broker = sel.value;
    if (broker === "__other") {
      broker = (prompt("Broker / platform name") || "").trim();
      if (!broker) { sel.value = ""; return; }
    }
    try {
      await postJson(`/api/mfs/${sel.dataset.brokerFor}/broker`, { broker });
      await renderApp();
    } catch (err) {
      alert(err.message);
    }
  }));
}

// How a fund was invested (the Engine's `kinds`): SIP running / stopped,
// lumpsum, or UNSET while a CAS opening balance awaits purchase details.
let mfView = "ALL";  // the MF tab's sub-page, kept across re-renders
const mfKinds = (mf) => mf.kinds || [];
const MF_KIND_TEXT = { SIP_RUNNING: "SIP · running", SIP_STOPPED: "SIP · stopped", LUMPSUM: "Lumpsum" };

const MF_BROKERS = ["FundsIndia", "Groww", "ET Money"];

function mfPortfolioRow(row, brokerChoices) {
  const mf = row.mf;
  const brokerCell = `<select data-broker-for="${mf.asset_id}" aria-label="Broker" style="min-width:0;padding:5px 8px;max-width:130px">
      <option value="" ${mf.broker ? "" : "selected"}>— set —</option>
      ${brokerChoices.map((b) => `<option ${b === mf.broker ? "selected" : ""}>${escapeHtml(b)}</option>`).join("")}
      <option value="__other">Other…</option>
    </select>`;
  const kinds = mfKinds(mf);
  const hasBoth = !mf.needs_purchase_details && Number(mf.sip_invested) > 0 && Number(mf.lumpsum_invested) > 0;
  const kindCell = mf.needs_purchase_details
    ? `${kinds.includes("SIP_RUNNING") ? `<div>SIP · running</div>` : ""}<button type="button" class="secondary" data-complete="${mf.asset_id}"
         style="padding:4px 9px;font-size:.78rem" title="Purchases before the CAS are undated — tell the app how this was invested">Details needed</button>`
    : kinds.map((k) => MF_KIND_TEXT[k]).join(" + ");
  const nav = mf.current_nav == null ? "—"
    : `${Number(mf.current_nav).toLocaleString(undefined, { maximumFractionDigits: 4 })}<div class="empty">${mf.current_nav_date ? fmtDate(mf.current_nav_date) : ""}</div>`;
  return `<tr data-kind="${kinds.join(" ")}" data-broker="${escapeHtml(mf.broker ?? "")}">
    <td class="mf-fund"><strong>${escapeHtml(mf.scheme_name)}</strong>
      <div class="empty">${escapeHtml(row.owner_name)} · folio ${escapeHtml(mf.folio_number)}${mf.isin ? "" : ` · <span class="loss" title="No ISIN: the NAV won't update by itself">no ISIN</span>`}</div>
      ${mf.sip_enabled && mf.sip_amount ? `<div class="empty">SIP ₹${money(mf.sip_amount)}/month${mf.sip_date ? " on the " + mf.sip_date + ordinal(mf.sip_date) : ""}</div>` : ""}
      <button type="button" class="secondary" data-mf-edit="${mf.asset_id}" style="padding:3px 10px;font-size:.76rem;margin-top:5px">Edit</button></td>
    <td>${kindCell}</td>
    <td>${brokerCell}</td>
    <td class="num">${Number(mf.units).toLocaleString(undefined, { maximumFractionDigits: 3 })}<div class="empty">avg ${mf.avg_nav ?? "—"}</div></td>
    <td class="num">${nav}</td>
    <td class="num">₹${money(mf.current_value)}<div class="empty">invested ₹${money(mf.invested_amount)}</div>${hasBoth
      ? `<div class="mf-split">SIP ₹${money(mf.sip_value)} <span class="empty">of ₹${money(mf.sip_invested)}</span></div>
         <div class="mf-split">Lumpsum ₹${money(mf.lumpsum_value)} <span class="empty">of ₹${money(mf.lumpsum_invested)}</span></div>` : ""}</td>
    ${gainCell(mf.gain_loss, mf.gain_loss_pct).replace("<td ", '<td style="text-align:right;white-space:nowrap" ')}
    <td class="num">${pct(mf.xirr)}${hasBoth
      ? `<div class="mf-split">SIP ${pct(mf.sip_xirr)}</div><div class="mf-split">Lumpsum ${pct(mf.lumpsum_xirr)}</div>` : ""}</td>
  </tr>`;
}
const ordinal = (n) => (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");

// ---------------------------------------------------------------- Stocks

// Stock prices synced from BSE are stored with source "OTHER" (the schema
// has no BSE value); only the sync writes it for stocks.
const PRICE_SOURCE_LABEL = { OTHER: "BSE" };

const CAP_LABEL = { LARGE: "Large cap", MID: "Mid cap", SMALL: "Small cap", UNKNOWN: "Not classified yet" };
const RISK_LABEL = { MODERATE: "Moderate", HIGH: "High", VERY_HIGH: "Very high" };
const TOLERANCE_LABEL = { CONSERVATIVE: "Conservative", MODERATE: "Moderate", AGGRESSIVE: "Aggressive" };

// Horizontal bars: widths are the Engine's percentages, nothing computed here.
function splitBars(slices, labelOf = (n) => n) {
  if (!slices.length) return `<p class="empty">Nothing yet</p>`;
  return slices.map((sl) => `
    <div class="bar-row">
      <span class="bar-label">${escapeHtml(labelOf(sl.name))}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.min(Number(sl.pct), 100)}%"></span></span>
      <span class="bar-value">${money(sl.pct)}% <span class="empty">₹${money(sl.value)}</span></span>
    </div>`).join("");
}

let stockView = "HOLDINGS";  // the Stocks tab's sub-page, kept across re-renders

async function renderStockTab({ familyId, members, selected, body }) {
  // The portfolio GET runs the daily NSE/BSE price sync first if it is due.
  const [p, sync] = await Promise.all([
    api(`/api/families/${familyId}/stocks${memberQuery(selected)}`),
    api(`/api/stocks/sync-status`),
  ]);
  const a = p.analysis;

  const priceNote = (st) => {
    const src = PRICE_SOURCE_LABEL[st.current_price_source] || st.current_price_source;
    return st.current_price_source
      ? `<div class="empty">${src}${st.current_price_date ? ", " + st.current_price_date : ""}</div>` : "";
  };
  const latestRow = (g) => p.rows.find((r) => g.parts.some((pt) => pt.asset_id === r.stock.asset_id)
    && r.stock.current_price != null);

  const groupRows = p.groups.map((g, i) => {
    const lr = latestRow(g);
    const multi = g.parts.length > 1;
    const partsRows = g.parts.map((pt) => `
